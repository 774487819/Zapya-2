            // ---------------- التنزيل والدمج والحفظ ----------------
            void _addBytes(int n) {
              _doneBytes += n;
              final now = DateTime.now();
              if (now.difference(_lastUi).inMilliseconds < 250) return;
              _lastUi = now;
              final secs = max(_sw.elapsedMilliseconds / 1000.0, 0.001);
              final mbps = (_doneBytes / (1024 * 1024)) / secs;
              final double frac =
                  _totalBytes > 0 ? (_doneBytes / _totalBytes).clamp(0.0, 1.0).toDouble() : 0.0;
              final pct = (frac * 100).floor();
              if (mounted) {
                setState(() {
                  _progress = frac;
                  _speed = '${mbps.toStringAsFixed(1)} MB/s';
                  _status = "جاري التنزيل... $pct%";
                });
              }
              _ntf("$pct% • ${mbps.toStringAsFixed(1)} MB/s", _totalBytes > 0 ? pct : -1);
            }

            // تقدّم محرك yt-dlp (يصل من الجانب الأصلي)
            void _onYtProgress(double p, String line) {
              if (!_ytdlpActive || p < 0) return;
              final now = DateTime.now();
              if (now.difference(_lastUi).inMilliseconds < 300) return;
              _lastUi = now;
              var speed = '';
              final m1 = RegExp(r'at\s+([\d.]+\s*[KMG]?i?B/s)').firstMatch(line);
              final m2 = RegExp(r'DL:([\d.]+\s*[KMG]?i?B)').firstMatch(line);
              if (m1 != null) {
                speed = m1.group(1)!;
              } else if (m2 != null) {
                speed = '${m2.group(1)}/s';
              }
              final pct = p.floor().clamp(0, 100);
              if (mounted) {
                setState(() {
                  _progress = (p / 100).clamp(0.0, 1.0).toDouble();
                  if (speed.isNotEmpty) _speed = speed;
                  _status = "جاري التنزيل... $pct%";
                });
              }
              _ntf(speed.isEmpty ? "$pct%" : "$pct% • $speed", pct);
            }

            Future<bool> _downloadAndSave(YtInfo info, QualityOption opt, String url) async {
              if (info.engine == 'yt-dlp') return _downloadViaYtdlp(info, opt);

              final tmp = await getTemporaryDirectory();
              final stamp = DateTime.now().millisecondsSinceEpoch;
              final vPath = '${tmp.path}/yt_$stamp.v';
              final aPath = '${tmp.path}/yt_$stamp.a';
              final dl = FastDownloader(cancelled: () => _cancelled, onBytes: _addBytes);

              Future<void> cleanup() async {
                for (final p in [vPath, aPath]) {
                  try {
                    final f = File(p);
                    if (await f.exists()) await f.delete();
                  } catch (_) {}
                }
              }

              try {
                var videoUrl = opt.video.url;
                var headers = info.headers;
                if (opt.server) {
                  _say("الخادم الخاص يجهّز الفيديو (${opt.height}p)...");
                  final link = await _serverLink(url, opt.height);
                  if (link == null) return false;
                  videoUrl = link;
                  headers = const {};
                }

                final vSize = (!opt.server && opt.video.size > 0)
                    ? opt.video.size
                    : await FastDownloader.sizeOf(videoUrl, headers);
                final aSize = opt.audio == null
                    ? 0
                    : (opt.audio!.size > 0 ? opt.audio!.size : await FastDownloader.sizeOf(opt.audio!.url, headers));
                _totalBytes = vSize > 0 ? vSize + aSize : 0;
                _doneBytes = 0;
                _sw
                  ..reset()
                  ..start();
                if (mounted) setState(() => _progress = 0);
                _say("جاري التنزيل بسرعة (اتصالات متوازية)...");

                final tasks = <Future<bool>>[dl.download(videoUrl, vPath, vSize, headers)];
                if (opt.audio != null) tasks.add(dl.download(opt.audio!.url, aPath, aSize, headers));
                final res = await Future.wait(tasks);
                _sw.stop();
                if (_cancelled || !res.every((x) => x)) {
                  await cleanup();
                  return false;
                }

                return await _finalize(
                  info: info,
                  opt: opt,
                  videoPath: vPath,
                  audioPath: opt.audio != null ? aPath : null,
                  ext: opt.webm ? 'webm' : 'mp4',
                  cleanup: cleanup,
                );
              } catch (_) {
                await cleanup();
                return false;
              }
            }

            Future<bool> _downloadViaYtdlp(YtInfo info, QualityOption opt) async {
              final tmp = await getTemporaryDirectory();
              final stamp = DateTime.now().millisecondsSinceEpoch;
              final prefix = 'yt_$stamp';
              final fmt = opt.audio != null ? '${opt.video.formatId}+${opt.audio!.formatId}' : opt.video.formatId;
              final merge = opt.audio != null ? (opt.webm ? 'webm' : 'mp4') : '';
              _ytdlpActive = true;
              _doneBytes = 0;
              if (mounted) {
                setState(() {
                  _progress = 0;
                  _speed = '';
                });
              }
              _say("جاري التنزيل بمحرك yt-dlp (${opt.height}p)...");
              try {
                final r = await _ch.invokeMethod<Map>('ytdlpDownload', {
                  'url': 'https://www.youtube.com/watch?v=${info.id}',
                  'format': fmt,
                  'merge': merge,
                  'prefix': prefix,
                  'dir': tmp.path,
                });
                if (_cancelled) {
                  return false;
                }
                if (r == null || r['path'] == null) {
                  _lastEngineError = '${r?['error'] ?? 'فشل التنزيل'}';
                  _say("فشل محرك yt-dlp: $_lastEngineError", ntf: false);
                  return false;
                }
                final path = '${r['path']}';
                final ext = path.split('.').last.toLowerCase();
                return await _finalize(
                  info: info,
                  opt: opt,
                  videoPath: path,
                  audioPath: null,
                  ext: ext,
                  cleanup: () async {
                    try {
                      final f = File(path);
                      if (await f.exists()) await f.delete();
                    } catch (_) {}
                  },
                );
              } catch (e) {
                _lastEngineError = '$e';
                return false;
              } finally {
                _ytdlpActive = false;
              }
            }

            Future<bool> _finalize({
              required YtInfo info,
              required QualityOption opt,
              required String videoPath,
              required String? audioPath,
              required String ext,
              required Future<void> Function() cleanup,
            }) async {
              _say("جاري الحفظ في المعرض...");
              _ntf("جاري الحفظ...", -1, force: true);
              final out = await _ch.invokeMethod<Map>('finalizeVideo', {
                'video': videoPath,
                'audio': audioPath,
                'webm': opt.webm,
                'ext': ext,
                'title': info.title,
              });
              if (out == null) {
                await cleanup();
                _say("فشل الحفظ (يتطلب أندرويد 10 أو أحدث).", ntf: false);
                return false;
              }
              final size = _int(out['size']);
              final now = DateTime.now();
              final date =
                  "${now.year}/${now.month.toString().padLeft(2, '0')}/${now.day.toString().padLeft(2, '0')} - ${now.hour}:${now.minute.toString().padLeft(2, '0')}";
              _history.insert(
                0,
                HistoryItem(
                  id: '${DateTime.now().millisecondsSinceEpoch}',
                  videoId: info.id,
                  title: info.title,
                  uri: '${out['uri']}',
                  quality: opt.label,
                  size: fmtSize(size),
                  date: date,
                ),
              );
              await _saveHistory();
              _lastNote = "تم تنزيل «${info.title}» (${opt.height}p) ✓";
              if (mounted) {
                setState(() {
                  _progress = 1;
                  _status = "تم التنزيل (${opt.label} • ${fmtSize(size)}) وحُفظ في المعرض ✓";
                });
              }
              return true;
            }

