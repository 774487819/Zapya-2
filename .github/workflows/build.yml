            // تنزيل متوازي: 4 اتصالات بأجزاء 2MB، مع "حارس توقف": إن لم يصل أي بايت 10 ثوانٍ نوقفه وننتقل للطريقة التالية
            Future<void> _downloadRanged(Uri url, String path, int total,
                Map<String, String> headers, void Function(int) onBytes) async {
              final f = File(path);
              if (await f.exists()) await f.delete();
              final raf = await f.open(mode: FileMode.write);
              bool failed = false;
              DateTime last = DateTime.now();
              final tok = CancelToken();
              final watchdog = Timer.periodic(const Duration(seconds: 1), (_) {
                if (_cancelRequested ||
                    DateTime.now().difference(last).inSeconds >= 10) {
                  failed = true;
                  if (!tok.isCancelled) tok.cancel('stall');
                }
              });
              try {
                await raf.truncate(total);
                const chunk = 2 * 1024 * 1024;
                int next = 0;

                Future<void> worker() async {
                  try {
                    while (!failed) {
                      final start = next;
                      if (start >= total) return;
                      next += chunk;
                      final end = (start + chunk < total ? start + chunk : total) - 1;
                      final u = url.replace(queryParameters: {
                        ...url.queryParameters,
                        'range': '$start-$end',
                      });
                      List<int>? data;
                      for (int attempt = 0; attempt < 2 && data == null; attempt++) {
                        try {
                          final res = await _dio.getUri<List<int>>(
                            u,
                            options: Options(
                              responseType: ResponseType.bytes,
                              headers: headers,
                              receiveTimeout: const Duration(seconds: 12),
                            ),
                            cancelToken: tok,
                          );
                          final code = res.statusCode ?? 0;
                          final d = res.data;
                          if ((code == 200 || code == 206) &&
                              d != null &&
                              d.length == end - start + 1) {
                            data = d;
                          }
                        } on DioException catch (e) {
                          if (e.type == DioExceptionType.cancel) rethrow;
                        }
                      }
                      if (data == null) throw Exception('chunk failed');
                      if (failed) return;
                      raf.setPositionSync(start);
                      raf.writeFromSync(data);
                      last = DateTime.now();
                      onBytes(data.length);
                    }
                  } catch (_) {
                    failed = true;
                    rethrow;
                  }
                }

                await Future.wait(List.generate(4, (_) => worker()));
              } finally {
                watchdog.cancel();
                await raf.close();
              }
              if (_cancelRequested) throw Exception('تم إيقاف التنزيل');
              if (failed) throw Exception('stalled');
            }

            // تنزيل ملف واحد بثلاث طرق متتالية: متوازي ← مكتبة يوتيوب (إن وُجدت) ← اتصال واحد عادي
            Future<void> _fetchOne(Uri url, int bytes, String path,
                Map<String, String> headers, StreamInfo? lib, void Function(int) onBytes) async {
              int counted = 0;
              void add(int n) {
                counted += n;
                onBytes(n);
              }

              Future<void> checkSize() async {
                final len = await File(path).length();
                if (len < bytes * 0.97) throw Exception('الملف ناقص');
              }

              // 1) متوازي
              try {
                await _downloadRanged(url, path, bytes, headers, add);
                return;
              } catch (_) {
                if (_cancelRequested) rethrow;
              }
              onBytes(-counted);
              counted = 0;
              if (mounted) {
                setState(() => _statusText = 'التنزيل المتوازي تعثّر، جارٍ استخدام طريقة أخرى...');
              }

              // 2) مكتبة يوتيوب (مع مهلة توقف 20 ثانية)
              if (lib != null) {
                try {
                  final f = File(path);
                  if (await f.exists()) await f.delete();
                  final sink = f.openWrite();
                  try {
                    await for (final chunk in _yt.videos.streamsClient
                        .get(lib)
                        .timeout(const Duration(seconds: 20))) {
                      if (_cancelRequested) break;
                      sink.add(chunk);
                      add(chunk.length);
                    }
                  } finally {
                    await sink.close();
                  }
                  if (_cancelRequested) throw Exception('تم إيقاف التنزيل');
                  await checkSize();
                  return;
                } catch (_) {
                  if (_cancelRequested) rethrow;
                  onBytes(-counted);
                  counted = 0;
                }
              }

              // 3) اتصال واحد عادي
              final f = File(path);
              if (await f.exists()) await f.delete();
              await _dio.download(
                url.toString(),
                path,
                cancelToken: _cancelToken,
                options: Options(
                  headers: headers,
                  receiveTimeout: const Duration(seconds: 20),
                ),
                onReceiveProgress: (r, t) {
                  final d = r - counted;
                  if (d > 0) add(d);
                },
              );
              if (_cancelRequested) throw Exception('تم إيقاف التنزيل');
              await checkSize();
            }

            Future<bool> _downloadYoutubeOption(_YtOption o, String savePath) async {
              final total = o.bytes;
              int got = 0;
              void onBytes(int n) {
                got += n;
                if (got < 0) got = 0;
                _setProgress((got / total).clamp(0.0, 1.0).toDouble());
              }

              final vPath = '$savePath.v.mp4';
              final aPath = '$savePath.a.m4a';
              try {
                if (!o.hasAudio) {
                  await _fetchOne(
                      o.videoUrl, o.videoBytes, savePath, o.headers, o.videoInfo, onBytes);
                } else {
                  // الفيديو والصوت يُنزَّلان معاً في نفس الوقت
                  await Future.wait([
                    _fetchOne(
                        o.videoUrl, o.videoBytes, vPath, o.headers, o.videoInfo, onBytes),
                    _fetchOne(
                        o.audioUrl!, o.audioBytes, aPath, o.headers, o.audioInfo, onBytes),
                  ]);
                  if (_cancelRequested) throw Exception('تم إيقاف التنزيل');
                  setState(() => _statusText = 'جاري دمج الصورة والصوت...');
                  final merged = await _channel.invokeMethod<bool>('mergeVideoAudio', {
                        'video': vPath,
                        'audio': aPath,
                        'out': savePath,
                      }) ??
                      false;
                  if (!merged) {
                    final f = File(savePath);
                    if (await f.exists()) await f.delete();
                    return false;
                  }
                }
              } catch (e) {
                final f = File(savePath);
                if (await f.exists()) await f.delete();
                rethrow;
              } finally {
                for (final p in [vPath, aPath]) {
                  try {
                    final f = File(p);
                    if (await f.exists()) await f.delete();
                  } catch (_) {}
                }
              }

              if (_cancelRequested) {
                final f = File(savePath);
                if (await f.exists()) await f.delete();
                throw Exception('تم إيقاف التنزيل');
              }

              final valid = await _channel
                      .invokeMethod<bool>('validateVideoFile', {'path': savePath}) ??
                  false;
              if (!valid) {
                final f = File(savePath);
                if (await f.exists()) await f.delete();
                return false;
              }
              return true;
            }

            // محركات احتياطية ليوتيوب: خادمك الخاص (yt-dlp) ثم APIs سحابية (غير مضمونة)
            Future<bool> _youtubeFallbackEngines(String url, String savePath) async {
              setState(() {
                _progress = 0;
                _statusText = 'جاري تجربة محركات بديلة ليوتيوب...';
              });
              final custom = await _tryCustomServer(url);
              if (custom != null &&
                  await _tryDownloadAndVerifyVideo(custom, savePath, false, 'الخادم الخاص')) {
                return true;
              }

              final encoded = Uri.encodeComponent(url);
              final apis = [
                'https://api.siputzx.my.id/api/d/ytmp4?url=$encoded',
                'https://api.vreden.my.id/api/ytmp4?url=$encoded',
                'https://api.ryzendesu.vip/api/downloader/ytdl?url=$encoded',
              ];
              for (final apiUrl in apis) {
                if (_cancelRequested) throw Exception('تم إيقاف التنزيل');
                try {
                  final res = await _dio.get(
                    apiUrl,
                    options: Options(responseType: ResponseType.bytes),
                  );
                  final raw = utf8.decode(res.data, allowMalformed: true);
                  for (final u in _extractAllValidVideoUrls(raw)) {
                    if (await _tryDownloadAndVerifyVideo(u, savePath, false, 'api سحابي')) {
                      return true;
                    }
                  }
                } catch (_) {}
              }
              return false;
            }

            Future<bool> _downloadYoutube(String url, String savePath) async {
              final id = _ytId(url);
              if (id == null) throw Exception('رابط يوتيوب غير صالح');

              _ytLog.clear();
              setState(() =>
                  _statusText = 'جاري جلب روابط الفيديو بعدة محركات بالتوازي...');
              final titleF = _ytTitle(id);
              final rs = _resolveYoutube(id);
              final first = await rs.first.future;
              if (_cancelRequested) throw Exception('تم إيقاف التنزيل');

              if (first != null) {
                String? t = first.title;
                t ??= await titleF;
                _lastYtTitle = t ?? 'فيديو يوتيوب';
                _notifTitle = _lastYtTitle;

                // الشورتس/الريلز (رابط /shorts/ أو مدة دقيقة تقريباً): أعلى دقة مباشرة بدون سؤال
                final isShort = url.contains('/shorts/') ||
                    (first.seconds > 0 && first.seconds <= 75);
                _YtOption chosen = first.options.first;
                if (!isShort) {
                  final c = await _chooseYoutubeQuality(
                      _lastYtTitle,
                      first.seconds > 0 ? Duration(seconds: first.seconds) : null,
                      first.options);
                  if (c == null) throw Exception('تم إلغاء التنزيل');
                  chosen = c;
                }
                if (_cancelRequested) throw Exception('تم إيقاف التنزيل');

                if (_notifActive) {
                  DownloadNotifier.update(0, _lastYtTitle).catchError((_) {});
                }

                // نجرّب نتيجة كل محرك بالترتيب: إن فشل التنزيل من رابط محرك ننتقل لرابط المحرك التالي
                Future<bool> attempt(_YtInfo inf) async {
                  final o = _matchOption(inf, chosen);
                  if (o == null) {
                    _ytLog.add('${inf.engine}: لا توجد دقة مطابقة');
                    return false;
                  }
                  setState(() {
                    _progress = 0;
                    _statusText = 'جاري تنزيل: $_lastYtTitle  (${inf.engine} - ${o.label})';
                  });
                  try {
                    if (await _downloadYoutubeOption(o, savePath)) return true;
                    _ytLog.add('${inf.engine}: الملف غير صالح بعد التنزيل');
                  } catch (e) {
                    if (_cancelRequested) rethrow;
                    _ytLog.add('تنزيل ${inf.engine}: ${_short(e)}');
                  }
                  final f = File(savePath);
                  if (await f.exists()) await f.delete();
                  return false;
                }

                final tried = <_YtInfo>[first];
                if (await attempt(first)) return true;

                // ننتظر بقية المحركات (إن لم تنتهِ) ثم نجرّبها واحداً واحداً
                await rs.all.future.timeout(const Duration(seconds: 25), onTimeout: () {});
                for (final inf in List<_YtInfo>.of(rs.infos)) {
                  if (tried.contains(inf)) continue;
                  if (_cancelRequested) throw Exception('تم إيقاف التنزيل');
                  tried.add(inf);
                  if (await attempt(inf)) return true;
                }
              }

              if (_cancelRequested) throw Exception('تم إيقاف التنزيل');
              if (await _youtubeFallbackEngines(url, savePath)) return true;
              _ytLog.add('المحركات الاحتياطية (خادمك/APIs): فشلت');
              throw Exception("فشلت كل محركات يوتيوب:\n${_ytLog.join('\n')}");
            }

            // مفتاح موحّد للفيديو لاكتشاف التكرار (بدون عوامل التتبع في الرابط)
            String _linkKey(String raw) {
              final m = RegExp(r'https?://[^\s"<>]+').firstMatch(raw);
              final url = m?.group(0) ?? raw.trim();
              final yt = RegExp(r'(?:youtu\.be/|v=|shorts/)([A-Za-z0-9_-]{11})')
                  .firstMatch(url);
              if (yt != null) return 'yt:${yt.group(1)}';
              final ig = _extractIgShortcodeFromText(url);
              if (ig != null) return 'ig:$ig';
              return url.split('?').first.split('#').first;
            }

            Future<void> _startVideoDownload(String rawInput) async {
              // تحميل أول، ثم الثاني: أي رابط يصل أثناء التحميل يدخل قائمة الانتظار
              if (_isDownloading) {
                _queue.add(rawInput);
                setState(() => _statusText =
                    "أُضيف إلى قائمة الانتظار (${_queue.length}) — سيُحمَّل بعد انتهاء الحالي");
                return;
              }

              final urlMatch = RegExp(r'https?://[^\s"<>]+').firstMatch(rawInput);
              final cleanUrl = urlMatch?.group(0) ?? rawInput.trim();

              final bool isYoutube =
                  cleanUrl.contains('youtube.com') || cleanUrl.contains('youtu.be');

              if (!cleanUrl.contains("tiktok.com") &&
                  !cleanUrl.contains("instagram.com") &&
                  !isYoutube) {
                setState(() {
                  _statusText =
                      "الرابط الملتقط غير مدعوم، يرجى نسخ رابط TikTok أو Instagram Reels أو YouTube.";
                });
                return;
              }

              final bool isTikTok = cleanUrl.contains("tiktok.com");
              final String platform = isYoutube
                  ? (cleanUrl.contains('/shorts/') ? 'YouTube Shorts' : 'YouTube')
                  : (isTikTok ? "TikTok" : "Instagram Reels");

              _cancelRequested = false;
              _cancelToken = CancelToken();
              String finishMsg = 'فشل التنزيل';

              setState(() {
                _isDownloading = true;
                _progress = 0.0;
                _statusText = "جاري استخراج وتنزيل الفيديو الكامل...";
              });

              try {
                // إشعار التنزيل (شريط التقدم + زر الإيقاف) لكل المنصات: ريلز، تيك توك، يوتيوب
                await _notifStart('جاري تنزيل فيديو $platform');

                final appDir = await getApplicationDocumentsDirectory();
                final videosDir = Directory('${appDir.path}/downloaded_reels');
                if (!await videosDir.exists()) {
                  await videosDir.create(recursive: true);
                }

                final id = DateTime.now().millisecondsSinceEpoch.toString();
                final localFilePath = '${videosDir.path}/vid_$id.mp4';

                final bool success = isYoutube
                    ? await _downloadYoutube(cleanUrl, localFilePath)
                    : isTikTok
                        ? await _downloadTikTokVerified(cleanUrl, localFilePath)
                        : await _downloadInstagramVerified(cleanUrl, localFilePath);

                if (_cancelRequested) throw Exception('تم إيقاف التنزيل');

                if (!success) {
                  throw Exception(
                      "تعذر الحصول على ملف فيديو صالح من جميع المحركات. السبب الأكثر شيوعاً: كل الـ APIs المجانية توقفت عن العمل - أضف رابط خادمك الخاص (yt-dlp) في الأسفل.");
                }

                await _channel.invokeMethod('saveToGallery', {'path': localFilePath});

                final fileBytes = await File(localFilePath).length();
                final sizeMb = "${(fileBytes / (1024 * 1024)).toStringAsFixed(1)} MB";
                final now = DateTime.now();
                final dateStr =
                    "${now.year}/${now.month.toString().padLeft(2, '0')}/${now.day.toString().padLeft(2, '0')} - ${now.hour}:${now.minute.toString().padLeft(2, '0')}";

                final shortcode = _extractIgShortcodeFromText(cleanUrl) ?? id;
                final newItem = DownloadedVideoItem(
                  id: id,
                  title: isYoutube
                      ? _lastYtTitle
                      : (isTikTok
                          ? "فيديو تيك توك بدون علامة"
                          : "فيديو ريلز ($shortcode)"),
                  platform: platform,
                  filePath: localFilePath,
                  date: dateStr,
                  sizeMb: sizeMb,
                );

                setState(() {
                  _downloadedVideos.insert(0, newItem);
                  _statusText =
                      "تم تنزيل الفيديو الكامل ($sizeMb) وحفظه في المعرض بنجاح!";
                });

                finishMsg = 'اكتمل التنزيل وحُفظ في المعرض ✅';
                await _saveVideoListToStorage();
                // حذف الرابط بعد التحميل (من خانة اللصق ومن الحافظة)
                await _clearLinkAfterDownload();
                await _channel.invokeMethod('vibrate', {'ms': 300});
              } catch (e) {
                _recentKeys.remove(_linkKey(cleanUrl));
                final msg = e.toString().replaceAll('Exception: ', '');
                if (_cancelRequested) {
                  finishMsg = 'تم إيقاف التنزيل';
                  setState(() => _statusText = 'تم إيقاف التنزيل');
                } else {
                  finishMsg = msg.contains('إلغاء') ? 'تم الإلغاء' : 'فشل التنزيل';
                  setState(() => _statusText = "تعذر التحميل: $msg");
                }
              } finally {
                await _notifFinish(finishMsg);
                _cancelToken = null;
                setState(() => _isDownloading = false);
                if (_queue.isNotEmpty) {
                  final next = _queue.removeAt(0);
                  Future.microtask(() => _startVideoDownload(next));
                }
              }
            }

            Future<void> _clearLinkAfterDownload() async {
              _manualUrlController.clear();
              try {
                await _channel.invokeMethod('clearClipboard');
              } catch (_) {}
            }

            Future<void> _deleteVideo(DownloadedVideoItem item) async {
              try {
                final f = File(item.filePath);
                if (await f.exists()) {
                  await f.delete();
                }
              } catch (_) {}

              setState(() {
                _downloadedVideos.removeWhere((v) => v.id == item.id);
              });
              await _saveVideoListToStorage();
            }

