            static YtStream? fromFormat(Map f, {bool? muxed}) {
              final url = f['url'];
              if (url is! String || url.isEmpty) return null;
              final mt = '${f['mimeType'] ?? f['type'] ?? ''}';
              final mime = mt.split(';').first.trim();
              var codec = '';
              final m = RegExp(r'codecs="([^"]+)"').firstMatch(mt);
              if (m != null) codec = m.group(1)!.toLowerCase();
              if (codec.isEmpty && f['codec'] != null) codec = '${f['codec']}'.toLowerCase();

              final hasVideo = mime.startsWith('video/');
              final hasAudio = muxed ?? (mime.startsWith('audio/') || codec.contains(','));
              if (hasVideo && !(codec.startsWith('avc1') || codec.startsWith('vp9') || codec.startsWith('vp09'))) {
                return null;
              }
              if (!hasVideo && !(codec.contains('mp4a') || codec.contains('opus'))) return null;

              var w = _int(f['width']);
              var h = _int(f['height']);
              if (h == 0 && f['size'] != null) {
                final p = '${f['size']}'.split('x');
                if (p.length == 2) {
                  w = int.tryParse(p[0]) ?? 0;
                  h = int.tryParse(p[1]) ?? 0;
                }
              }
              if (h == 0 && f['qualityLabel'] != null) {
                h = int.tryParse(RegExp(r'(\d{3,4})p').firstMatch('${f['qualityLabel']}')?.group(1) ?? '') ?? 0;
              }
              var size = _int(f['contentLength'] ?? f['clen']);
              if (size <= 0) size = int.tryParse(Uri.parse(url).queryParameters['clen'] ?? '') ?? 0;
              return YtStream(
                url: url,
                mime: mime,
                codec: codec,
                w: w,
                h: h,
                fps: _int(f['fps']),
                bitrate: _int(f['bitrate']),
                size: size,
                hasVideo: hasVideo,
                hasAudio: hasAudio,
              );
            }

            // 1+2) InnerTube مباشرة (عملاء VR و iOS)
            Future<YtInfo?> innerTube(String id, int idx) async {
              final clients = <Map<String, dynamic>>[
                {
                  'body': {
