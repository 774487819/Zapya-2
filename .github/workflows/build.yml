          // ============================ التحميل السريع (اتصالات متوازية) ============================
          class FastDownloader {
            final bool Function() cancelled;
            final void Function(int) onBytes;
            FastDownloader({required this.cancelled, required this.onBytes});

            static bool _useParam(String url) => url.contains('googlevideo.com');

            static Future<HttpClientResponse> open(
                HttpClient c, String url, int s, int e, Map<String, String> headers) async {
              final param = _useParam(url);
              var uri = Uri.parse(url);
              if (param) {
                uri = uri.replace(queryParameters: {...uri.queryParameters, 'range': '$s-$e'});
              }
              final req = await c.getUrl(uri);
              headers.forEach((k, v) => req.headers.set(k, v));
              if (!param) req.headers.set('Range', 'bytes=$s-$e');
              return await req.close();
            }

            static Future<bool> probe(String url, Map<String, String> headers) async {
              final c = HttpClient()..connectionTimeout = const Duration(seconds: 8);
              try {
                final res = await open(c, url, 0, 1, headers).timeout(const Duration(seconds: 10));
                final ok = res.statusCode == 200 || res.statusCode == 206;
                await res.drain();
                return ok;
              } catch (_) {
                return false;
              } finally {
                c.close(force: true);
              }
            }

            static Future<int> sizeOf(String url, Map<String, String> headers) async {
              final clen = int.tryParse(Uri.parse(url).queryParameters['clen'] ?? '');
              if (clen != null && clen > 0) return clen;
              final c = HttpClient()..connectionTimeout = const Duration(seconds: 8);
              try {
                final res = await open(c, url, 0, 0, headers).timeout(const Duration(seconds: 10));
                final cr = res.headers.value('content-range');
                await res.drain();
                if (cr != null && cr.contains('/')) {
                  return int.tryParse(cr.split('/').last) ?? 0;
                }
              } catch (_) {
              } finally {
                c.close(force: true);
              }
              return 0;
            }

            Future<bool> download(String url, String path, int size, Map<String, String> headers,
                {int workers = 6, int chunk = 4 * 1024 * 1024}) async {
              if (size <= 0) return _single(url, path, headers);

              final file = File(path);
              if (await file.exists()) await file.delete();
              final raf = await file.open(mode: FileMode.write);
              await raf.truncate(size);

              final chunks = (size / chunk).ceil();
              var next = 0;
              var failed = false;

              Future<void> worker() async {
                final client = HttpClient()..connectionTimeout = const Duration(seconds: 12);
                try {
                  while (!failed && !cancelled()) {
                    final i = next++;
                    if (i >= chunks) break;
                    final start = i * chunk;
                    final end = min(start + chunk, size) - 1;
                    var ok = false;
                    for (int attempt = 0; attempt < 4 && !cancelled(); attempt++) {
                      var counted = 0;
                      try {
                        final res = await open(client, url, start, end, headers);
                        if (res.statusCode != 206 && res.statusCode != 200) {
                          await res.drain();
                          throw HttpException('status ${res.statusCode}');
                        }
                        var pos = start;
                        await for (final data in res) {
                          if (cancelled()) throw StateError('cancel');
                          final room = end + 1 - pos;
                          final bytes = data.length > room ? data.sublist(0, room) : data;
                          raf.setPositionSync(pos);
                          raf.writeFromSync(bytes);
                          pos += bytes.length;
                          counted += bytes.length;
                          onBytes(bytes.length);
                          if (pos > end) break;
                        }
                        if (pos == end + 1) {
                          ok = true;
                          break;
                        }
                        throw HttpException('short');
                      } catch (_) {
                        onBytes(-counted);
                        await Future.delayed(Duration(milliseconds: 300 * (attempt + 1)));
                      }
                    }
                    if (!ok) failed = true;
                  }
                } finally {
                  client.close(force: true);
                }
              }

              try {
                await Future.wait(List.generate(workers, (_) => worker()));
              } finally {
                await raf.close();
              }
              if (failed || cancelled()) {
                try {
                  await file.delete();
                } catch (_) {}
                return false;
              }
              return true;
            }

            Future<bool> _single(String url, String path, Map<String, String> headers) async {
              final file = File(path);
              final client = HttpClient()..connectionTimeout = const Duration(seconds: 12);
              final IOSink sink = file.openWrite();
              var ok = false;
              try {
                final req = await client.getUrl(Uri.parse(url));
                headers.forEach((k, v) => req.headers.set(k, v));
                final res = await req.close();
                if (res.statusCode == 200) {
                  var stopped = false;
                  await for (final data in res) {
                    if (cancelled()) {
                      stopped = true;
                      break;
                    }
                    sink.add(data);
                    onBytes(data.length);
                  }
                  ok = !stopped;
                } else {
                  await res.drain();
                }
              } catch (_) {
                ok = false;
              }
              try {
                await sink.flush();
              } catch (_) {}
              try {
                await sink.close();
              } catch (_) {}
              client.close(force: true);
              if (!ok) {
                try {
                  if (await file.exists()) await file.delete();
                } catch (_) {}
              }
              return ok;
            }
          }

