            Widget _historyTab() {
              if (_history.isEmpty) {
                return const Center(
                  child: Padding(
                    padding: EdgeInsets.all(32),
                    child: Column(mainAxisSize: MainAxisSize.min, children: [
                      Icon(Icons.video_collection_outlined, size: 64, color: Colors.white30),
                      SizedBox(height: 16),
                      Text("لا توجد تنزيلات بعد", style: TextStyle(fontSize: 18, fontWeight: FontWeight.w800)),
                      SizedBox(height: 8),
                      Text("الفيديوهات تُحفظ في المعرض داخل مجلد YouTubeSaver",
                          textAlign: TextAlign.center, style: TextStyle(color: Colors.white54, fontSize: 13)),
                    ]),
                  ),
                );
              }
              return ListView.builder(
                padding: const EdgeInsets.fromLTRB(18, 10, 18, 24),
                itemCount: _history.length,
                itemBuilder: (context, i) {
                  final it = _history[i];
                  return Dismissible(
                    key: ValueKey(it.id),
                    direction: DismissDirection.horizontal,
                    background: _delBg(Alignment.centerRight),
                    secondaryBackground: _delBg(Alignment.centerLeft),
                    onDismissed: (_) async {
                      try {
                        await _ch.invokeMethod('deleteUri', {'uri': it.uri});
                      } catch (_) {}
                      setState(() => _history.removeWhere((x) => x.id == it.id));
                      await _saveHistory();
                    },
                    child: GestureDetector(
                      onTap: () => _ch.invokeMethod('openUri', {'uri': it.uri}),
                      child: Container(
                        margin: const EdgeInsets.only(bottom: 12),
                        padding: const EdgeInsets.all(12),
                        decoration: BoxDecoration(
                          color: kCardColor,
                          borderRadius: BorderRadius.circular(20),
                          border: Border.all(color: Colors.white10),
                        ),
                        child: Row(children: [
                          ClipRRect(
                            borderRadius: BorderRadius.circular(12),
                            child: Image.network(
                              'https://i.ytimg.com/vi/${it.videoId}/mqdefault.jpg',
                              width: 96,
                              height: 62,
                              fit: BoxFit.cover,
                              errorBuilder: (_, __, ___) => Container(
                                width: 96,
                                height: 62,
                                color: Colors.white10,
                                child: const Icon(Icons.play_arrow_rounded, color: Colors.white54),
                              ),
                            ),
                          ),
                          const SizedBox(width: 12),
                          Expanded(
                            child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                              Text(it.title,
                                  maxLines: 2,
                                  overflow: TextOverflow.ellipsis,
                                  style: const TextStyle(fontWeight: FontWeight.w800, fontSize: 13.5)),
                              const SizedBox(height: 6),
                              Text('${it.quality} • ${it.size}', style: const TextStyle(color: kRed, fontSize: 12)),
                              const SizedBox(height: 2),
                              Text(it.date, style: const TextStyle(color: Colors.white38, fontSize: 11)),
                            ]),
                          ),
                          const Icon(Icons.play_circle_fill_rounded, color: Colors.white38),
                        ]),
                      ),
                    ),
                  );
                },
              );
            }

            Widget _delBg(Alignment a) => Container(
                  margin: const EdgeInsets.only(bottom: 12),
                  padding: const EdgeInsets.symmetric(horizontal: 24),
                  alignment: a,
                  decoration: BoxDecoration(color: Colors.redAccent.withOpacity(0.25), borderRadius: BorderRadius.circular(20)),
                  child: const Icon(Icons.delete_rounded, color: Colors.redAccent),
                );
          }
          EOF

      - name: Analyze (prints Dart errors clearly in the log)
        continue-on-error: true
        run: |
          cd yt_build
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | grep -E "error" | head -40 || true

      - name: Build Release APK (arm64)
        run: |
          cd yt_build
          flutter build apk --release --target-platform android-arm64

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Saver-APK
          path: yt_build/build/app/outputs/flutter-apk/app-release.apk
