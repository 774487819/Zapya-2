name: Build YouTube Saver APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project & Install Packages
        run: |
          flutter create -a kotlin --org com.ytsaver --project-name yt_saver_app yt_build
          cd yt_build
          flutter pub add dio shared_preferences path_provider youtube_explode_dart

      - name: Add yt-dlp engine to Gradle (Python + ffmpeg + aria2c inside the app)
        run: |

          cat << 'EOF' > gradle_patch.py
          import os, sys

          base = 'yt_build/android/app'
          kts = os.path.join(base, 'build.gradle.kts')
          grv = os.path.join(base, 'build.gradle')

          KTS_EXTRA = '''

          // ===== إضافات محرك yt-dlp (تُلحق تلقائياً) =====
          android {
              defaultConfig {
                  minSdk = 24
              }
              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
              buildTypes {
                  getByName("release") {
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
              }
          }

          dependencies {
              implementation("io.github.junkfood02.youtubedl-android:library:0.17.+")
              implementation("io.github.junkfood02.youtubedl-android:ffmpeg:0.17.+")
              implementation("io.github.junkfood02.youtubedl-android:aria2c:0.17.+")
          }
          '''

          GRV_EXTRA = '''

          // ===== إضافات محرك yt-dlp (تُلحق تلقائياً) =====
          android {
              defaultConfig {
                  minSdkVersion 24
              }
              packagingOptions {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          dependencies {
              implementation "io.github.junkfood02.youtubedl-android:library:0.17.+"
              implementation "io.github.junkfood02.youtubedl-android:ffmpeg:0.17.+"
              implementation "io.github.junkfood02.youtubedl-android:aria2c:0.17.+"
          }
          '''

          if os.path.exists(kts):
              path, extra = kts, KTS_EXTRA
          elif os.path.exists(grv):
              path, extra = grv, GRV_EXTRA
          else:
              print('ERROR: no app gradle file found')
              sys.exit(1)

          with open(path, 'a', encoding='utf-8') as f:
              f.write(extra)
          print('PATCHED', path)
          print(open(path, encoding='utf-8').read())
          EOF

          python3 gradle_patch.py

      - name: Configure Android Manifest, Strings and Accessibility
        run: |
          mkdir -p yt_build/android/app/src/main/res/values
          mkdir -p yt_build/android/app/src/main/res/xml
          cat << 'EOF' > yt_build/android/app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">محمّل يوتيوب السريع</string>
              <string name="acc_desc">يكتشف النقر المزدوج خلف الهاتف أثناء استخدام تطبيق يوتيوب فقط، ثم ينسخ رابط الفيديو ويحمّله تلقائياً</string>
          </resources>
          EOF

          cat << 'EOF' > yt_build/android/app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:description="@string/acc_desc"
              android:notificationTimeout="100" />
          EOF

          cat << 'EOF' > yt_build/android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>

              <application
                  android:label="@string/app_name"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                      <!-- استقبال الروابط من زر "مشاركة" في تطبيق يوتيوب -->
                      <intent-filter>
                          <action android:name="android.intent.action.SEND"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <data android:mimeType="text/plain"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".DownloadForegroundService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />

                  <service
                      android:name=".AutoYtGrabberService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Write Native Kotlin (yt-dlp, back-tap service, muxer, notification)
        run: |
          mkdir -p yt_build/android/app/src/main/kotlin/com/ytsaver/yt_saver_app
          cat << 'EOF' > yt_build/android/app/src/main/kotlin/com/ytsaver/yt_saver_app/MainActivity.kt
          package com.ytsaver.yt_saver_app

          import android.Manifest
          import android.accessibilityservice.AccessibilityService
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.ClipboardManager
          import android.content.ComponentName
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.graphics.Rect
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.media.MediaCodec
          import android.media.MediaExtractor
          import android.media.MediaFormat
          import android.media.MediaMuxer
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.provider.MediaStore
          import android.provider.Settings
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import com.yausername.aria2c.Aria2c
          import com.yausername.ffmpeg.FFmpeg
          import com.yausername.youtubedl_android.YoutubeDL
          import com.yausername.youtubedl_android.YoutubeDLRequest
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.io.FileDescriptor
          import java.io.FileInputStream
          import java.nio.ByteBuffer
          import kotlin.math.abs

          class MainActivity : FlutterActivity() {
              companion object {
                  @Volatile var channelRef: MethodChannel? = null
              }

              private var pendingShared: String? = null
              private var pendingAuto: String? = null
              private var waitingClip = false
              private val mainHandler = Handler(Looper.getMainLooper())

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  pendingShared = extractShared(intent)
                  if (intent?.getBooleanExtra("auto_copied", false) == true) waitingClip = true
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 77)
                  }
              }

              private fun extractShared(i: Intent?): String? {
                  if (i?.action == Intent.ACTION_SEND && i.type?.startsWith("text/") == true) {
                      return i.getStringExtra(Intent.EXTRA_TEXT)
                  }
                  return null
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  val t = extractShared(intent)
                  if (t != null) {
                      if (channelRef != null) channelRef?.invokeMethod("onSharedText", t) else pendingShared = t
                  }
                  if (intent.getBooleanExtra("auto_copied", false)) waitingClip = true
              }

              // قراءة الحافظة تتطلب أن تكون النافذة في الواجهة (قيد أندرويد)
              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus && waitingClip) {
                      waitingClip = false
                      intent?.removeExtra("auto_copied")
                      mainHandler.postDelayed({ captureClipboard() }, 150)
                  }
              }

              private fun captureClipboard() {
                  val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  val clip = cm.primaryClip
                  val text = if (clip != null && clip.itemCount > 0) clip.getItemAt(0).coerceToText(this).toString() else ""
                  val ok = text.contains("youtu.be") || text.contains("youtube.com")
                  if (!ok) {
                      Haptics.failure(this)
                      moveTaskToBack(true)
                      return
                  }
                  DownloadForegroundService.show(applicationContext, "جاري التحضير...", -1)
                  pendingAuto = text
                  // الريلز (Shorts): نعود فوراً ليوتيوب. الطويل: يبقى التطبيق ليسألك عن الدقة.
                  if (text.contains("/shorts/")) moveTaskToBack(true)
                  channelRef?.invokeMethod("onAutoLink", text, object : MethodChannel.Result {
                      override fun success(result: Any?) { pendingAuto = null }
                      override fun error(errorCode: String, errorMessage: String?, errorDetails: Any?) {}
                      override fun notImplemented() {}
                  })
              }

              private fun isServiceEnabled(): Boolean {
                  val expected = ComponentName(this, AutoYtGrabberService::class.java)
                  val enabled = Settings.Secure.getString(
                      contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: return false
                  return enabled.split(':').any { ComponentName.unflattenFromString(it) == expected }
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  val ch = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "yt_saver/channel")
                  channelRef = ch
                  ch.setMethodCallHandler { call, result ->
                      when (call.method) {
                          "getSharedText" -> {
                              val t = pendingShared
                              pendingShared = null
                              result.success(t)
                          }
                          "getAutoLink" -> {
                              val t = pendingAuto
                              pendingAuto = null
                              result.success(t)
                          }
                          "openAccessibilitySettings" -> {
                              startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                              result.success(true)
                          }
                          "requestOverlayPermission" -> {
                              if (!Settings.canDrawOverlays(this)) {
                                  startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                              }
                              result.success(true)
                          }
                          "checkPermissions" -> {
                              result.success(
                                  mapOf(
                                      "accessibility" to isServiceEnabled(),
                                      "overlay" to Settings.canDrawOverlays(this)
                                  )
                              )
                          }
                          "updateSensitivity" -> {
                              val v = call.argument<Double>("value") ?: 11.5
                              getSharedPreferences("yt_prefs", Context.MODE_PRIVATE).edit().putFloat("sensitivity", v.toFloat()).apply()
                              result.success(true)
                          }
                          "getSensitivity" -> {
                              result.success(getSharedPreferences("yt_prefs", Context.MODE_PRIVATE).getFloat("sensitivity", 11.5f).toDouble())
                          }
                          "moveToBack" -> {
                              moveTaskToBack(true)
                              result.success(true)
                          }
                          "dlUpdate" -> {
                              DownloadForegroundService.show(
                                  applicationContext,
                                  call.argument<String>("text") ?: "",
                                  call.argument<Int>("progress") ?: -1
                              )
                              result.success(true)
                          }
                          "dlStop" -> {
                              DownloadForegroundService.finish(call.argument<String>("text") ?: "")
                              result.success(true)
                          }
                          "ytdlpInit" -> {
                              Thread {
                                  val e = YtDlp.init(applicationContext)
                                  runOnUiThread { result.success(e) }
                              }.start()
                          }
                          "ytdlpUpdate" -> {
                              Thread {
                                  val s = YtDlp.update(applicationContext)
                                  runOnUiThread { result.success(s) }
                              }.start()
                          }
                          "ytdlpInfo" -> {
                              val url = call.argument<String>("url") ?: ""
                              Thread {
                                  val m = YtDlp.info(applicationContext, url)
                                  runOnUiThread { result.success(m) }
                              }.start()
                          }
                          "ytdlpDownload" -> {
                              val url = call.argument<String>("url") ?: ""
                              val format = call.argument<String>("format") ?: "bv*+ba/b"
                              val merge = call.argument<String>("merge") ?: ""
                              val prefix = call.argument<String>("prefix") ?: "yt"
                              val dir = call.argument<String>("dir") ?: cacheDir.absolutePath
                              Thread {
                                  val m = YtDlp.download(applicationContext, url, format, merge, prefix, dir)
                                  runOnUiThread { result.success(m) }
                              }.start()
                          }
                          "ytdlpCancel" -> {
                              YtDlp.cancel()
                              result.success(true)
                          }
                          "finalizeVideo" -> {
                              val video = call.argument<String>("video") ?: ""
                              val audio = call.argument<String>("audio")
                              val webm = call.argument<Boolean>("webm") ?: false
                              val ext = call.argument<String>("ext") ?: (if (webm) "webm" else "mp4")
                              val title = call.argument<String>("title") ?: "video"
                              Thread {
                                  val out = Finalizer.finalizeVideo(applicationContext, video, audio, webm, ext, title)
                                  runOnUiThread { result.success(out) }
                              }.start()
                          }
                          "openUri" -> {
                              try {
                                  val i = Intent(Intent.ACTION_VIEW).apply {
                                      setDataAndType(Uri.parse(call.argument<String>("uri")), "video/*")
                                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                                  }
                                  startActivity(i)
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.success(false)
                              }
                          }
                          "deleteUri" -> {
                              val ok = try {
                                  contentResolver.delete(Uri.parse(call.argument<String>("uri")), null, null) > 0
                              } catch (e: Exception) {
                                  false
                              }
                              result.success(ok)
                          }
                          "uriExists" -> {
                              val ok = try {
                                  contentResolver.openFileDescriptor(Uri.parse(call.argument<String>("uri")), "r")?.use { true } ?: false
                              } catch (e: Exception) {
                                  false
                              }
                              result.success(ok)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }
          }

          object Haptics {
              @Suppress("DEPRECATION")
              fun vibrate(ctx: Context, ms: Long) {
                  try {
                      val v = ctx.getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          v.vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE))
                      } else {
                          v.vibrate(ms)
                      }
                  } catch (_: Exception) {}
              }

              // اهتزازتان قصيرتان = فشل
              @Suppress("DEPRECATION")
              fun failure(ctx: Context) {
                  try {
                      val v = ctx.getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                      val pattern = longArrayOf(0, 80, 90, 80)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          v.vibrate(VibrationEffect.createWaveform(pattern, -1))
                      } else {
                          v.vibrate(pattern, -1)
                      }
                  } catch (_: Exception) {}
              }
          }

          // ===================== محرك yt-dlp الأصلي (Python + ffmpeg + aria2c داخل التطبيق) =====================
          object YtDlp {
              @Volatile private var ready = false
              private val lock = Any()
              @Volatile private var currentProcess: String? = null
              private val ui = Handler(Looper.getMainLooper())

              fun init(ctx: Context): String? {
                  synchronized(lock) {
                      if (ready) return null
                      return try {
                          YoutubeDL.getInstance().init(ctx)
                          FFmpeg.getInstance().init(ctx)
                          try { Aria2c.getInstance().init(ctx) } catch (_: Throwable) {}
                          ready = true
                          null
                      } catch (e: Throwable) {
                          e.message ?: e.toString()
                      }
                  }
              }

              fun update(ctx: Context): String {
                  val err = init(ctx)
                  if (err != null) return "update failed: $err"
                  return try {
                      val r = YoutubeDL.getInstance().updateYoutubeDL(ctx)
                      "updated: $r"
                  } catch (e: Throwable) {
                      "update failed: ${e.message ?: e}"
                  }
              }

              fun info(ctx: Context, url: String): Map<String, Any?> {
                  val err = init(ctx)
                  if (err != null) return mapOf("error" to "init: $err")
                  return try {
                      val req = YoutubeDLRequest(url)
                      req.addOption("-J")
                      req.addOption("--no-playlist")
                      req.addOption("--no-warnings")
                      val resp = YoutubeDL.getInstance().execute(req)
                      mapOf("json" to resp.out)
                  } catch (e: Throwable) {
                      mapOf("error" to (e.message ?: e.toString()).take(400))
                  }
              }

              fun cancel() {
                  val p = currentProcess ?: return
                  try { YoutubeDL.getInstance().destroyProcessById(p) } catch (_: Throwable) {}
              }

              private fun run(url: String, format: String, merge: String, prefix: String, dir: String, aria: Boolean): String? {
                  val req = YoutubeDLRequest(url)
                  req.addOption("-f", format)
                  if (merge.isNotEmpty()) req.addOption("--merge-output-format", merge)
                  req.addOption("-o", "$dir/$prefix.%(ext)s")
                  req.addOption("--no-playlist")
                  req.addOption("--no-mtime")
                  if (aria) {
                      req.addOption("--downloader", "libaria2c.so")
                      req.addOption("--external-downloader-args", "aria2c:-x 8 -s 8 -k 1M --summary-interval=1")
                  } else {
                      req.addOption("-N", "4")
                  }
                  val pid = "yt_" + System.currentTimeMillis()
                  currentProcess = pid
                  return try {
                      YoutubeDL.getInstance().execute(req, pid) { progress, _, line ->
                          ui.post {
                              MainActivity.channelRef?.invokeMethod(
                                  "onYtProgress",
                                  mapOf("p" to progress.toDouble(), "line" to line)
                              )
                          }
                      }
                      null
                  } catch (e: Throwable) {
                      e.message ?: e.toString()
                  } finally {
                      currentProcess = null
                  }
              }

              fun download(ctx: Context, url: String, format: String, merge: String, prefix: String, dir: String): Map<String, Any?> {
                  val err = init(ctx)
                  if (err != null) return mapOf("error" to "init: $err")
                  var e = run(url, format, merge, prefix, dir, true)
                  // إن فشل aria2c نعيد المحاولة بالمحمّل الداخلي
                  if (e != null && !e.contains("destroy", true) && !e.contains("cancel", true) && !e.contains("interrupt", true)) {
                      e = run(url, format, merge, prefix, dir, false)
                  }
                  val files = File(dir).listFiles { f ->
                      f.name.startsWith("$prefix.") && f.extension.lowercase() in setOf("mp4", "webm", "mkv", "m4a")
                  }?.sortedByDescending { it.length() }
                  val best = files?.firstOrNull()
                  return if (best != null && best.length() > 0 && e == null) {
                      mapOf("path" to best.absolutePath)
                  } else {
                      mapOf("error" to (e ?: "لم يُنتج ملف").take(400))
                  }
              }
          }

          // ===================== حفظ الفيديو في المعرض ودمج الصورة مع الصوت =====================
          object Finalizer {
              fun finalizeVideo(ctx: Context, videoPath: String, audioPath: String?, webm: Boolean, ext: String, title: String): Map<String, Any>? {
                  if (Build.VERSION.SDK_INT < 29) return null
                  val safe = title.replace(Regex("[\\\\/:*?\"<>|\\n\\r]"), "_").trim().take(60).ifBlank { "video" }
                  val e = if (audioPath != null) (if (webm) "webm" else "mp4") else ext.lowercase().ifBlank { "mp4" }
                  val mime = when (e) {
                      "webm" -> "video/webm"
                      "mkv" -> "video/x-matroska"
                      else -> "video/mp4"
                  }
                  val name = "${safe}_${System.currentTimeMillis()}.$e"
                  val values = ContentValues().apply {
                      put(MediaStore.Video.Media.DISPLAY_NAME, name)
                      put(MediaStore.Video.Media.MIME_TYPE, mime)
                      put(MediaStore.Video.Media.RELATIVE_PATH, Environment.DIRECTORY_MOVIES + "/YouTubeSaver")
                      put(MediaStore.Video.Media.IS_PENDING, 1)
                  }
                  val resolver = ctx.contentResolver
                  val uri = resolver.insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, values) ?: return null
                  return try {
                      if (audioPath != null) {
                          val pfd = resolver.openFileDescriptor(uri, "rw") ?: throw IllegalStateException("fd")
                          pfd.use { muxInto(it.fileDescriptor, videoPath, audioPath, webm) }
                      } else {
                          resolver.openOutputStream(uri)!!.use { out ->
                              FileInputStream(videoPath).use { it.copyTo(out, 1 shl 20) }
                          }
                      }
                      values.clear()
                      values.put(MediaStore.Video.Media.IS_PENDING, 0)
                      resolver.update(uri, values, null, null)
                      val size = resolver.openFileDescriptor(uri, "r")?.use { it.statSize } ?: 0L
                      mapOf("uri" to uri.toString(), "size" to size, "name" to name)
                  } catch (ex: Exception) {
                      try { resolver.delete(uri, null, null) } catch (_: Exception) {}
                      null
                  } finally {
                      try { File(videoPath).delete() } catch (_: Exception) {}
                      audioPath?.let { try { File(it).delete() } catch (_: Exception) {} }
                  }
              }

              private fun findTrack(ex: MediaExtractor, prefix: String): Int {
                  for (i in 0 until ex.trackCount) {
                      val mime = ex.getTrackFormat(i).getString(MediaFormat.KEY_MIME) ?: continue
                      if (mime.startsWith(prefix)) return i
                  }
                  return -1
              }

              private fun muxInto(fd: FileDescriptor, videoPath: String, audioPath: String, webm: Boolean) {
                  val vEx = MediaExtractor()
                  val aEx = MediaExtractor()
                  var muxer: MediaMuxer? = null
                  try {
                      vEx.setDataSource(videoPath)
                      aEx.setDataSource(audioPath)
                      val vi = findTrack(vEx, "video/")
                      val ai = findTrack(aEx, "audio/")
                      if (vi < 0 || ai < 0) throw IllegalStateException("no tracks")
                      vEx.selectTrack(vi)
                      aEx.selectTrack(ai)
                      muxer = MediaMuxer(
                          fd,
                          if (webm) MediaMuxer.OutputFormat.MUXER_OUTPUT_WEBM else MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4
                      )
                      val vt = muxer.addTrack(vEx.getTrackFormat(vi))
                      val at = muxer.addTrack(aEx.getTrackFormat(ai))
                      muxer.start()
                      val buf = ByteBuffer.allocate(8 * 1024 * 1024)
                      val info = MediaCodec.BufferInfo()
                      var vDone = false
                      var aDone = false
                      while (!vDone || !aDone) {
                          val vTime = if (vDone) Long.MAX_VALUE else vEx.sampleTime
                          val aTime = if (aDone) Long.MAX_VALUE else aEx.sampleTime
                          if (!vDone && vTime < 0) { vDone = true; continue }
                          if (!aDone && aTime < 0) { aDone = true; continue }
                          val useV = vTime <= aTime
                          val ex = if (useV) vEx else aEx
                          val track = if (useV) vt else at
                          buf.clear()
                          val size = ex.readSampleData(buf, 0)
                          if (size < 0) {
                              if (useV) vDone = true else aDone = true
                              continue
                          }
                          val flags = if (ex.sampleFlags and MediaExtractor.SAMPLE_FLAG_SYNC != 0) MediaCodec.BUFFER_FLAG_KEY_FRAME else 0
                          info.set(0, size, ex.sampleTime, flags)
                          muxer.writeSampleData(track, buf, info)
                          ex.advance()
                      }
                      muxer.stop()
                  } finally {
                      try { muxer?.release() } catch (_: Exception) {}
                      try { vEx.release() } catch (_: Exception) {}
                      try { aEx.release() } catch (_: Exception) {}
                  }
              }
          }

          // ===================== خدمة النقر الخلفي (تعمل داخل تطبيق يوتيوب فقط) =====================
          class AutoYtGrabberService : AccessibilityService(), SensorEventListener {
              private val targetPackages = setOf("com.google.android.youtube")

              private var sensorManager: SensorManager? = null
              private var listening = false
              private var busy = false
              private var firstTapTime: Long = 0
              private var lastActionTime: Long = 0
              private val handler = Handler(Looper.getMainLooper())

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  sensorManager = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  if (isTargetForeground()) startListening()
              }

              private fun isTargetForeground(): Boolean {
                  val pkg = rootInActiveWindow?.packageName?.toString() ?: return false
                  return pkg in targetPackages
              }

              private fun startListening() {
                  if (listening) return
                  val sensor = sensorManager?.getDefaultSensor(Sensor.TYPE_LINEAR_ACCELERATION) ?: return
                  sensorManager?.registerListener(this, sensor, SensorManager.SENSOR_DELAY_GAME)
                  listening = true
              }

              private fun stopListening() {
                  if (!listening) return
                  sensorManager?.unregisterListener(this)
                  listening = false
                  firstTapTime = 0
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null || event.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
                  val pkg = event.packageName?.toString() ?: return
                  when {
                      pkg in targetPackages -> startListening()
                      pkg == packageName || pkg == "android" ||
                          pkg.contains("systemui") || pkg.contains("inputmethod") || pkg.contains("keyboard") -> Unit
                      else -> stopListening()
                  }
              }

              override fun onSensorChanged(event: SensorEvent?) {
                  if (event == null || busy) return
                  val sensitivity = getSharedPreferences("yt_prefs", Context.MODE_PRIVATE).getFloat("sensitivity", 11.5f)
                  val x = abs(event.values[0])
                  val y = abs(event.values[1])
                  val z = abs(event.values[2])
                  if (z > sensitivity && x < 6.0f && y < 6.0f) {
                      val now = System.currentTimeMillis()
                      if (now - lastActionTime < 5000) return
                      if (now - firstTapTime > 500) {
                          firstTapTime = now
                      } else {
                          val diff = now - firstTapTime
                          if (diff in 120..500) {
                              firstTapTime = 0
                              if (!isTargetForeground()) return
                              lastActionTime = now
                              executeShareAndCopy()
                          }
                      }
                  }
              }

              private fun executeShareAndCopy() {
                  val root = rootInActiveWindow ?: return
                  busy = true
                  Haptics.vibrate(this, 120)
                  val shareWords = listOf("مشاركة", "Share", "share", "Send", "إرسال")
                  if (!findAndClickNode(root, shareWords)) {
                      Haptics.failure(this)
                      busy = false
                      return
                  }
                  waitAndClickCopy(0)
              }

              private fun waitAndClickCopy(attempt: Int) {
                  val delayMs = if (attempt == 0) 900L else 400L
                  handler.postDelayed({
                      val currentRoot = rootInActiveWindow
                      val copyWords = listOf("نسخ الرابط", "نسخ", "Copy link", "Copy URL", "copy")
                      val clicked = currentRoot != null && findAndClickNode(currentRoot, copyWords)
                      when {
                          clicked -> handler.postDelayed({
                              val launch = Intent(this, MainActivity::class.java).apply {
                                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_REORDER_TO_FRONT)
                                  putExtra("auto_copied", true)
                              }
                              startActivity(launch)
                              busy = false
                          }, 450)
                          attempt < 5 -> waitAndClickCopy(attempt + 1)
                          else -> {
                              Haptics.failure(this)
                              busy = false
                          }
                      }
                  }, delayMs)
              }

              // نضغط فقط العناصر الظاهرة فعلاً على الشاشة (يوتيوب يجهّز فيديوهات مجاورة في الخلفية)
              private fun isOnScreen(node: AccessibilityNodeInfo): Boolean {
                  if (!node.isVisibleToUser) return false
                  val r = Rect()
                  node.getBoundsInScreen(r)
                  if (r.width() <= 0 || r.height() <= 0) return false
                  val m = resources.displayMetrics
                  return r.centerX() in 0..m.widthPixels && r.centerY() in 0..m.heightPixels
              }

              private fun findAndClickNode(node: AccessibilityNodeInfo, keywords: List<String>): Boolean {
                  if (isOnScreen(node)) {
                      val text = node.text?.toString() ?: ""
                      val desc = node.contentDescription?.toString() ?: ""
                      val viewId = node.viewIdResourceName ?: ""
                      for (word in keywords) {
                          if (text.contains(word, ignoreCase = true) ||
                              desc.contains(word, ignoreCase = true) ||
                              viewId.contains(word, ignoreCase = true)
                          ) {
                              if (clickClickableParent(node)) return true
                          }
                      }
                  }
                  for (i in 0 until node.childCount) {
                      val child = node.getChild(i) ?: continue
                      if (findAndClickNode(child, keywords)) return true
                  }
                  return false
              }

              private fun clickClickableParent(node: AccessibilityNodeInfo?): Boolean {
                  var current = node
                  while (current != null) {
                      if (current.isClickable) return current.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                      current = current.parent
                  }
                  return false
              }

              override fun onUnbind(intent: Intent?): Boolean {
                  stopListening()
                  return super.onUnbind(intent)
              }

              override fun onDestroy() {
                  stopListening()
                  super.onDestroy()
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}
              override fun onInterrupt() {}
          }

          // ===================== إشعار التنزيل: شريط تقدم + زر "إيقاف التنزيل" =====================
          class DownloadForegroundService : Service() {

              companion object {
                  private const val CH = "yt_progress"
                  private const val NID = 3001
                  private const val RESULT_ID = 3002
                  const val ACTION_CANCEL = "com.ytsaver.yt_saver_app.CANCEL_DOWNLOAD"

                  @Volatile var instance: DownloadForegroundService? = null
                  private var pendingText = "جاري التحضير..."
                  private var pendingPct = -1

                  fun show(ctx: Context, text: String, pct: Int) {
                      pendingText = text
                      pendingPct = pct
                      val inst = instance
                      if (inst != null) {
                          inst.render()
                          return
                      }
                      try {
                          val i = Intent(ctx, DownloadForegroundService::class.java)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) ctx.startForegroundService(i) else ctx.startService(i)
                      } catch (_: Exception) {}
                  }

                  fun finish(text: String) {
                      instance?.finishWith(text)
                  }
              }

              private var started = false
              private val nm: NotificationManager by lazy {
                  getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  instance = this
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      nm.createNotificationChannel(NotificationChannel(CH, "تقدم التنزيل", NotificationManager.IMPORTANCE_LOW))
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_CANCEL) {
                      if (!started) {
                          stopSelf(startId)
                          return START_NOT_STICKY
                      }
                      MainActivity.channelRef?.invokeMethod("onCancelRequested", null)
                      pendingText = "جاري إيقاف التنزيل..."
                      pendingPct = -1
                      render()
                      return START_NOT_STICKY
                  }
                  render()
                  return START_NOT_STICKY
              }

              private fun openAppIntent(): PendingIntent =
                  PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )

              private fun builder(): Notification.Builder =
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, CH)
                  } else {
                      @Suppress("DEPRECATION")
                      Notification.Builder(this)
                  }

              private fun progressNotification(text: String, pct: Int): Notification {
                  val cancelPi = PendingIntent.getService(
                      this, 1,
                      Intent(this, DownloadForegroundService::class.java).setAction(ACTION_CANCEL),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val b = builder()
                      .setContentTitle("محمّل يوتيوب السريع")
                      .setContentText(text)
                      .setSmallIcon(android.R.drawable.stat_sys_download)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setProgress(100, pct.coerceAtLeast(0), pct < 0)
                      .setContentIntent(openAppIntent())
                  @Suppress("DEPRECATION")
                  b.addAction(android.R.drawable.ic_delete, "إيقاف التنزيل", cancelPi)
                  return b.build()
              }

              fun render() {
                  val n = progressNotification(pendingText, pendingPct)
                  if (!started) {
                      started = true
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          startForeground(NID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                      } else {
                          startForeground(NID, n)
                      }
                  } else {
                      nm.notify(NID, n)
                  }
              }

              fun finishWith(text: String) {
                  instance = null
                  started = false
                  @Suppress("DEPRECATION")
                  stopForeground(true)
                  if (text.isNotEmpty()) {
                      val n = builder()
                          .setContentTitle("محمّل يوتيوب السريع")
                          .setContentText(text)
                          .setSmallIcon(android.R.drawable.stat_sys_download_done)
                          .setAutoCancel(true)
                          .setContentIntent(openAppIntent())
                          .build()
                      nm.notify(RESULT_ID, n)
                  }
                  stopSelf()
              }

              override fun onDestroy() {
                  if (instance === this) instance = null
                  super.onDestroy()
              }
          }
