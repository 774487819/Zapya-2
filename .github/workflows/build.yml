                  'X-YouTube-Client-Version': c['cv'],
                  'Origin': 'https://www.youtube.com',
                  'Content-Type': 'application/json',
                }),
              );
              final j = res.data is String ? jsonDecode(res.data) : res.data;
              if (j is! Map || j['playabilityStatus']?['status'] != 'OK') return null;
              final sd = j['streamingData'];
              if (sd is! Map) return null;
              final streams = <YtStream>[];
              for (final f in [...(sd['adaptiveFormats'] as List? ?? []), ...(sd['formats'] as List? ?? [])]) {
                if (f is Map) {
                  final s = fromFormat(f);
                  if (s != null) streams.add(s);
                }
              }
              final d = j['videoDetails'] ?? {};
              return YtInfo(
                id: id,
                title: '${d['title'] ?? 'فيديو يوتيوب'}',
                durationSec: _int(d['lengthSeconds']),
                streams: streams,
                headers: {'User-Agent': c['ua'] as String},
              );
            }

            // 3) مكتبة youtube_explode_dart (ديناميكي لتجنب مشاكل تغيّر الواجهة بين الإصدارات)
            Future<YtInfo?> explode(String id) async {
              final dynamic yt = YoutubeExplode();
              try {
                final dynamic video = await yt.videos.get('https://www.youtube.com/watch?v=$id');
                final dynamic m = await yt.videos.streamsClient.getManifest(id);
                final streams = <YtStream>[];

                YtStream? conv(dynamic s, {required bool v, required bool a}) {
                  try {
                    final container = '${s.container.name}'.toLowerCase();
                    final mime = '${v ? 'video' : 'audio'}/$container';
                    final codec = '${v ? s.videoCodec : s.audioCodec}'.toLowerCase();
                    final fake = <String, dynamic>{
                      'url': '${s.url}',
                      'mimeType': '$mime; codecs="$codec${a && v ? ', mp4a.40.2' : ''}"',
                      'bitrate': s.bitrate.bitsPerSecond,
                      'contentLength': s.size.totalBytes,
                      if (v) 'width': s.videoResolution.width,
                      if (v) 'height': s.videoResolution.height,
                      if (v) 'fps': (s.framerate.framesPerSecond as num).round(),
                    };
                    return fromFormat(fake, muxed: a && v ? true : (v ? false : true));
                  } catch (_) {
                    return null;
                  }
                }

                for (final dynamic s in m.videoOnly) {
                  final x = conv(s, v: true, a: false);
                  if (x != null) streams.add(x);
                }
                for (final dynamic s in m.audioOnly) {
                  final x = conv(s, v: false, a: true);
                  if (x != null) streams.add(x);
                }
                for (final dynamic s in m.muxed) {
                  final x = conv(s, v: true, a: true);
                  if (x != null) streams.add(x);
                }
                final dur = video.duration;
                return YtInfo(
                  id: id,
                  title: '${video.title}',
                  durationSec: dur == null ? 0 : (dur.inSeconds as int),
                  streams: streams,
                );
              } finally {
                yt.close();
              }
            }

            // 4) Piped
            Future<YtInfo?> piped(String id) async {
              for (final base in kPipedInstances) {
                try {
                  final r = await dio.get('$base/streams/$id');
                  final j = r.data is String ? jsonDecode(r.data) : r.data;
                  if (j is! Map || j['videoStreams'] is! List) continue;
                  final streams = <YtStream>[];
                  for (final s in j['videoStreams']) {
                    if (s is! Map) continue;
                    final only = s['videoOnly'] == true;
                    final f = {
                      'url': s['url'],
                      'mimeType': '${s['mimeType']}; codecs="${s['codec']}"',
                      'width': s['width'],
                      'height': s['height'],
                      'fps': s['fps'],
                      'bitrate': s['bitrate'],
                      'contentLength': (_int(s['contentLength']) > 0) ? s['contentLength'] : 0,
                    };
                    final x = fromFormat(f, muxed: !only);
                    if (x != null) streams.add(x);
                  }
                  for (final s in (j['audioStreams'] as List? ?? [])) {
                    if (s is! Map) continue;
                    final f = {
                      'url': s['url'],
                      'mimeType': '${s['mimeType']}; codecs="${s['codec']}"',
                      'bitrate': s['bitrate'],
                      'contentLength': s['contentLength'],
                    };
                    final x = fromFormat(f);
                    if (x != null) streams.add(x);
                  }
                  if (streams.isEmpty) continue;
                  return YtInfo(
                    id: id,
                    title: '${j['title'] ?? 'فيديو يوتيوب'}',
                    durationSec: _int(j['duration']),
                    streams: streams,
                  );
                } catch (_) {}
              }
              return null;
            }

            // 5) Invidious
            Future<YtInfo?> invidious(String id) async {
              for (final base in kInvidiousInstances) {
                try {
                  final r = await dio.get('$base/api/v1/videos/$id?local=true');
                  final j = r.data is String ? jsonDecode(r.data) : r.data;
                  if (j is! Map) continue;
                  final streams = <YtStream>[];
                  for (final f in (j['adaptiveFormats'] as List? ?? [])) {
                    if (f is Map) {
                      final x = fromFormat(f);
                      if (x != null) streams.add(x);
                    }
                  }
                  for (final f in (j['formatStreams'] as List? ?? [])) {
                    if (f is Map) {
                      final x = fromFormat(f, muxed: true);
                      if (x != null) streams.add(x);
                    }
                  }
                  if (streams.isEmpty) continue;
                  return YtInfo(
                    id: id,
                    title: '${j['title'] ?? 'فيديو يوتيوب'}',
                    durationSec: _int(j['lengthSeconds']),
                    streams: streams,
                  );
                } catch (_) {}
              }
              return null;
            }

            // بناء قائمة الجودات المتاحة (حتى 4K) مع حجم تقريبي لكل جودة
            static List<QualityOption> buildOptions(YtInfo info) {
              final vids = info.streams.where((s) => s.hasVideo && !s.hasAudio).toList();
              final auds = info.streams.where((s) => s.hasAudio && !s.hasVideo).toList();
              final muxed = info.streams.where((s) => s.hasVideo && s.hasAudio).toList();
              final heights = <int>{
                ...vids.map((s) => s.h),
                ...muxed.map((s) => s.h),
              }.where((h) => h > 0).toList()
                ..sort((a, b) => b.compareTo(a));

              YtStream? bestAudio(bool mp4) {
                final l = auds.where((a) => mp4 ? a.isMp4 : a.isWebm).toList()
                  ..sort((a, b) => b.bitrate.compareTo(a.bitrate));
                return l.isEmpty ? null : l.first;
              }

              final out = <QualityOption>[];
              for (final h in heights) {
                final cand = vids.where((s) => s.h == h).toList();
                QualityOption? opt;
                if (cand.isNotEmpty) {
                  cand.sort((a, b) {
                    // حتى 1080: نفضّل MP4 (متوافق أكثر)، وما فوقها WebM/VP9
                    int pa = (h <= 1080 ? (a.isMp4 ? 0 : 1) : (a.isWebm ? 0 : 1));
                    int pb = (h <= 1080 ? (b.isMp4 ? 0 : 1) : (b.isWebm ? 0 : 1));
                    if (pa != pb) return pa.compareTo(pb);
                    return b.bitrate.compareTo(a.bitrate);
                  });
                  for (final v in cand) {
                    final a = bestAudio(v.isMp4);
                    if (a != null) {
                      opt = QualityOption(
                        height: h,
                        fps: v.fps,
                        video: v,
                        audio: a,
                        webm: v.isWebm,
                        size: v.size + a.size,
                      );
                      break;
                    }
                  }
                }
                if (opt == null) {
                  final mx = muxed.where((s) => s.h == h).toList();
                  if (mx.isNotEmpty) {
                    opt = QualityOption(
                        height: h,
                        fps: mx.first.fps,
                        video: mx.first,
                        webm: mx.first.isWebm,
                        server: info.server,
                        size: mx.first.size);
                  }
                }
                if (opt != null) out.add(opt);
              }
              return out;
            }
          }

          // ============================ التطبيق ============================
          class YtSaverApp extends StatelessWidget {
            const YtSaverApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: kAppTitle,
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark(useMaterial3: true).copyWith(
                  scaffoldBackgroundColor: kBg,
                  colorScheme: const ColorScheme.dark(primary: kRed, secondary: kViolet, surface: kSurface),
                ),
                home: const Home(),
              );
            }
          }

          class Home extends StatefulWidget {
            const Home({super.key});

            @override
            State<Home> createState() => _HomeState();
          }

          class _HomeState extends State<Home> with WidgetsBindingObserver {
            static const MethodChannel _ch = MethodChannel('yt_saver/channel');
            final Dio _dio = Dio(BaseOptions(
              connectTimeout: const Duration(seconds: 12),
              receiveTimeout: const Duration(seconds: 20),
              validateStatus: (s) => s != null && s < 500,
              headers: {
                'User-Agent':
                    'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36',
              },
            ));
            late final YtEngines _eng = YtEngines(_dio);

            final TextEditingController _urlCtl = TextEditingController();
            final TextEditingController _serverCtl = TextEditingController();

            int _tab = 0;
            bool _busy = false;
            bool _cancelled = false;
            String _status = "الصق رابط فيديو يوتيوب، أو انقر مرتين خلف الهاتف أثناء مشاهدة فيديو في تطبيق يوتيوب";
            double _progress = 0;
            String _speed = '';
            List<HistoryItem> _history = [];
            final List<String> _queue = [];
            final Set<String> _autoUrls = {};
            final Map<String, DateTime> _recent = {};
            String _lastNote = '';
            String _lastEngineError = '';

            // الصلاحيات والمحرك
            bool _accOk = false;
            bool _overlayOk = false;
            double _sens = 11.5;
            String _engineStatus = 'جاري تجهيز محرك yt-dlp...';
            bool _engineBusy = false;
            bool _ytdlpActive = false;

            int _doneBytes = 0;
            int _totalBytes = 0;
            final Stopwatch _sw = Stopwatch();
            DateTime _lastUi = DateTime.fromMillisecondsSinceEpoch(0);
            DateTime _lastNtf = DateTime.fromMillisecondsSinceEpoch(0);

            @override
            void initState() {
              super.initState();
              WidgetsBinding.instance.addObserver(this);
              _ch.setMethodCallHandler((call) async {
                switch (call.method) {
                  case 'onSharedText':
                    _enqueue('${call.arguments}');
                    break;
                  case 'onAutoLink':
                    _enqueue('${call.arguments}', auto: true);
                    break;
                  case 'onCancelRequested':
                    _cancelRequested();
                    break;
                  case 'onYtProgress':
                    final m = call.arguments;
                    if (m is Map) _onYtProgress((m['p'] as num).toDouble(), '${m['line']}');
                    break;
                }
              });
              _init();
            }

            @override
            void didChangeAppLifecycleState(AppLifecycleState state) {
              if (state == AppLifecycleState.resumed) _checkPerms();
            }

            Future<void> _init() async {
              final prefs = await SharedPreferences.getInstance();
              _serverCtl.text = prefs.getString('yt_server') ?? '';
              final raw = prefs.getStringList('yt_history') ?? [];
              final list = <HistoryItem>[];
              for (final s in raw) {
                try {
                  final it = HistoryItem.fromJson(jsonDecode(s));
                  final ok = await _ch.invokeMethod<bool>('uriExists', {'uri': it.uri}) ?? false;
                  if (ok) list.add(it);
                } catch (_) {}
              }
              if (mounted) setState(() => _history = list);
              await _checkPerms();
              try {
                final s = await _ch.invokeMethod<double>('getSensitivity');
                if (s != null && mounted) setState(() => _sens = s);
              } catch (_) {}
              try {
                final shared = await _ch.invokeMethod<String>('getSharedText');
                if (shared != null && shared.isNotEmpty) _enqueue(shared);
                final auto = await _ch.invokeMethod<String>('getAutoLink');
                if (auto != null && auto.isNotEmpty) _enqueue(auto, auto: true);
              } catch (_) {}
              // تجهيز محرك yt-dlp وتحديثه (مرة كل 12 ساعة) في الخلفية
              unawaited(_prepareEngine(prefs));
            }

            Future<void> _checkPerms() async {
              try {
                final r = await _ch.invokeMethod<Map>('checkPermissions');
                if (r != null && mounted) {
                  setState(() {
                    _accOk = r['accessibility'] == true;
                    _overlayOk = r['overlay'] == true;
                  });
                }
              } catch (_) {}
            }

            Future<void> _prepareEngine(SharedPreferences prefs, {bool force = false}) async {
              if (_engineBusy) return;
              _engineBusy = true;
              if (mounted) setState(() => _engineStatus = 'جاري تجهيز محرك yt-dlp...');
              try {
                final err = await _ch.invokeMethod<String>('ytdlpInit');
                if (err != null) {
                  if (mounted) setState(() => _engineStatus = 'تعذر تشغيل محرك yt-dlp: $err');
                  return;
                }
                final last = prefs.getInt('ytdlp_updated') ?? 0;
                final now = DateTime.now().millisecondsSinceEpoch;
                if (force || now - last > 12 * 3600 * 1000) {
                  if (mounted) setState(() => _engineStatus = 'جاري تحديث محرك yt-dlp إلى آخر إصدار...');
                  final res = await _ch.invokeMethod<String>('ytdlpUpdate') ?? '';
                  if (!res.startsWith('update failed')) await prefs.setInt('ytdlp_updated', now);
                  if (mounted) setState(() => _engineStatus = res.startsWith('update failed') ? 'المحرك جاهز (تعذر التحديث، تأكد من الإنترنت)' : 'المحرك جاهز ومحدَّث ✓');
                } else {
                  if (mounted) setState(() => _engineStatus = 'المحرك جاهز ✓');
                }
              } catch (e) {
                if (mounted) setState(() => _engineStatus = 'تعذر تجهيز المحرك: $e');
              } finally {
                _engineBusy = false;
              }
            }

            @override
            void dispose() {
              WidgetsBinding.instance.removeObserver(this);
              _urlCtl.dispose();
              _serverCtl.dispose();
              super.dispose();
            }

            Future<void> _saveHistory() async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setStringList('yt_history', _history.map((e) => jsonEncode(e.toJson())).toList());
            }

            // ---------------- الإشعار ----------------
            void _ntf(String text, int pct, {bool force = false}) {
              final now = DateTime.now();
              if (!force && now.difference(_lastNtf).inMilliseconds < 500) return;
              _lastNtf = now;
              _ch.invokeMethod('dlUpdate', {'text': text, 'progress': pct}).catchError((_) {});
            }

            void _say(String s, {bool ntf = true}) {
              if (mounted) setState(() => _status = s);
              if (ntf && _busy) _ntf(s, -1, force: true);
            }

            void _cancelRequested() {
              _cancelled = true;
              _queue.clear();
              _ch.invokeMethod('ytdlpCancel').catchError((_) {});
              _say("جاري إيقاف التنزيل...", ntf: false);
            }

            // ---------------- الروابط والطابور ----------------
            String? _videoId(String raw) {
              final m = RegExp(r'https?://[^\s"<>]+').firstMatch(raw);
              final url = m?.group(0) ?? raw.trim();
              if (!(url.contains('youtube.com') || url.contains('youtu.be'))) return null;
              final r = RegExp(r'(?:v=|youtu\.be/|shorts/|embed/|live/|v/)([A-Za-z0-9_-]{11})').firstMatch(url);
              return r?.group(1);
            }

            void _enqueue(String raw, {bool auto = false}) {
              final id = _videoId(raw);
              if (id == null) {
                _say("الرابط ليس رابط فيديو يوتيوب صالحاً.", ntf: false);
                if (auto && !_busy) _ch.invokeMethod('dlStop', {'text': ''}).catchError((_) {});
                return;
              }
              if (auto) {
                // منع تحميل نفس الفيديو مرتين (رابط قديم عالق في الحافظة)
                final last = _recent[id];
                if (last != null && DateTime.now().difference(last).inMinutes < 10) {
                  _say("هذا نفس الفيديو الذي حُمّل قبل قليل (لم يُنسخ رابط جديد). انقر مرتين على الفيديو التالي.",
                      ntf: false);
                  if (!_busy) _ch.invokeMethod('dlStop', {'text': ''}).catchError((_) {});
                  return;
                }
                _recent[id] = DateTime.now();
              }
              final m = RegExp(r'https?://[^\s"<>]+').firstMatch(raw);
              final url = m?.group(0) ?? raw.trim();
              _queue.add(url);
              if (auto) _autoUrls.add(url);
              if (_busy) {
                _say("أُضيف إلى قائمة الانتظار (${_queue.length})", ntf: false);
              }
              _pump();
            }

            Future<void> _pump() async {
              if (_busy) return;
              _busy = true;
              _cancelled = false;
              if (mounted) setState(() {});
              _ntf("جاري التحضير...", -1, force: true);
              try {
                while (_queue.isNotEmpty && !_cancelled) {
                  final url = _queue.removeAt(0);
                  await _processLink(url);
                }
              } finally {
                _busy = false;
                final note = _cancelled ? "تم إيقاف التنزيل" : _lastNote;
                _cancelled = false;
                _ch.invokeMethod('dlStop', {'text': note}).catchError((_) {});
                if (mounted) setState(() {});
              }
            }

            // ---------------- محرك yt-dlp على الهاتف ----------------
            Future<YtInfo?> _engYtdlp(String id) async {
              final r = await _ch.invokeMethod<Map>('ytdlpInfo', {'url': 'https://www.youtube.com/watch?v=$id'});
              if (r == null) {
                _lastEngineError = 'لا رد من المحرك';
                return null;
              }
              if (r['json'] == null) {
                _lastEngineError = '${r['error'] ?? 'خطأ غير معروف'}';
                return null;
              }
              final j = jsonDecode('${r['json']}');
              if (j is! Map) return null;
              final streams = <YtStream>[];
              for (final f in (j['formats'] as List? ?? [])) {
                if (f is! Map) continue;
                final proto = '${f['protocol'] ?? ''}';
                if (proto.contains('m3u8') || proto.contains('mhtml')) continue;
                final vc = '${f['vcodec'] ?? 'none'}'.toLowerCase();
                final ac = '${f['acodec'] ?? 'none'}'.toLowerCase();
                final hasV = vc != 'none';
                final hasA = ac != 'none';
                if (!hasV && !hasA) continue;
                final ext = '${f['ext'] ?? ''}';
                if (hasV && !(vc.startsWith('avc1') || vc.startsWith('vp9') || vc.startsWith('vp09'))) continue;
                if (!hasV && !(ac.contains('mp4a') || ac.contains('opus'))) continue;
                final mime = hasV ? 'video/$ext' : (ext == 'm4a' ? 'audio/mp4' : 'audio/$ext');
                var size = _int(f['filesize']);
                if (size <= 0) size = _int(f['filesize_approx']);
                streams.add(YtStream(
                  url: '',
                  mime: mime,
                  formatId: '${f['format_id']}',
                  codec: hasV ? vc : ac,
                  w: _int(f['width']),
                  h: _int(f['height']),
                  fps: _int(f['fps']),
                  bitrate: ((f['tbr'] is num ? (f['tbr'] as num) : 0) * 1000).round(),
                  size: size,
                  hasVideo: hasV,
                  hasAudio: hasA,
                ));
              }
              if (streams.isEmpty) {
                _lastEngineError = 'لم يُعثر على صيغ صالحة';
                return null;
              }
              final dur = j['duration'];
              return YtInfo(
                id: id,
                title: '${j['title'] ?? 'فيديو يوتيوب'}',
                durationSec: dur is num ? dur.round() : 0,
                streams: streams,
              );
            }

            // ---------------- المعالجة ----------------
            Future<YtInfo?> _resolve(String id, String url, Set<String> failed) async {
              final engines = <MapEntry<String, Future<YtInfo?> Function()>>[
                MapEntry('yt-dlp', () => _engYtdlp(id)),
                MapEntry('InnerTube-VR', () => _eng.innerTube(id, 0)),
                MapEntry('InnerTube-iOS', () => _eng.innerTube(id, 1)),
                MapEntry('youtube_explode', () => _eng.explode(id)),
                MapEntry('Piped', () => _eng.piped(id)),
                MapEntry('Invidious', () => _eng.invidious(id)),
              ];
              for (final e in engines) {
                if (_cancelled) return null;
                if (failed.contains(e.key)) continue;
                _say("جاري الفحص عبر محرك: ${e.key}");
                try {
                  final info = await e.value().timeout(Duration(seconds: e.key == 'yt-dlp' ? 120 : 25));
                  if (info == null) {
                    failed.add(e.key);
                    continue;
                  }
                  info.engine = e.key;
                  final opts = YtEngines.buildOptions(info);
                  if (opts.isEmpty) {
                    failed.add(e.key);
                    continue;
                  }
                  if (e.key == 'yt-dlp') return info;
                  // بقية المحركات: فحص سريع أن الرابط يعمل قبل عرضه
                  if (await FastDownloader.probe(opts.first.video.url, info.headers)) return info;
                  failed.add(e.key);
                } catch (_) {
                  failed.add(e.key);
                }
              }
              if (!failed.contains('server')) {
                final s = await _engServer(id, url);
                if (s != null) {
                  s.engine = 'server';
                  return s;
                }
                failed.add('server');
              }
              return null;
            }

            Future<YtInfo?> _engServer(String id, String url) async {
              final base = _serverCtl.text.trim();
              if (base.isEmpty) return null;
              var title = 'فيديو يوتيوب';
              try {
                final r = await _dio.get('https://www.youtube.com/oembed?url=${Uri.encodeComponent(url)}&format=json');
                final j = r.data is String ? jsonDecode(r.data) : r.data;
                if (j is Map && j['title'] != null) title = '${j['title']}';
              } catch (_) {}
              final streams = [2160, 1440, 1080, 720, 480, 360]
                  .map((h) => YtStream(url: '', mime: 'video/mp4', h: h, hasVideo: true, hasAudio: true))
                  .toList();
              return YtInfo(id: id, title: title, durationSec: 0, streams: streams, server: true);
            }

            Future<String?> _serverLink(String url, int h) async {
              final base = _serverCtl.text.trim();
              if (base.isEmpty) return null;
              try {
                final sep = base.contains('?') ? '&' : '?';
                final r = await _dio.get(
                  '$base${sep}url=${Uri.encodeComponent(url)}&height=$h',
                  options: Options(receiveTimeout: const Duration(seconds: 180)),
                );
                if (r.data is String && (r.data as String).trim().startsWith('http')) {
                  return (r.data as String).trim();
                }
                final j = r.data is String ? jsonDecode(r.data) : r.data;
                if (j is Map && '${j['url']}'.startsWith('http')) return '${j['url']}';
              } catch (_) {}
              return null;
            }

            Future<void> _processLink(String url) async {
              final id = _videoId(url)!;
              final isAuto = _autoUrls.remove(url);
              final failed = <String>{};
              int? wantedHeight;
              _lastNote = '';
              _lastEngineError = '';

              void moveBackIfAuto() {
                if (isAuto) _ch.invokeMethod('moveToBack').catchError((_) {});
              }

              for (int attempt = 0; attempt < 6 && !_cancelled; attempt++) {
                _say("جاري فحص الفيديو...");
                final info = await _resolve(id, url, failed);
                if (_cancelled) {
                  _recent.remove(id);
                  return;
                }
                if (info == null) {
                  _recent.remove(id);
                  _lastNote = "تعذر التحميل: لا يوجد محرك يعمل";
                  _say(
                      "تعذر الوصول للفيديو من كل المحركات.\nسبب yt-dlp: ${_lastEngineError.isEmpty ? 'غير معروف' : _lastEngineError}\n\nجرّب زر «تحديث المحرك» بالأسفل ثم أعد المحاولة.",
                      ntf: false);
                  moveBackIfAuto();
                  return;
                }
                final options = YtEngines.buildOptions(info);
                QualityOption opt;
                if (wantedHeight == null) {
                  final isShort = url.contains('/shorts/') || (info.durationSec > 0 && info.durationSec <= 90);
                  if (isShort) {
                    opt = _pickBest(options, 1080);
                  } else {
                    _ntf("بانتظار تأكيدك...", -1, force: true);
                    _say("بانتظار اختيار الجودة...", ntf: false);
                    final chosen = await _askUser(info, options, url);
                    if (chosen == null) {
                      _recent.remove(id);
                      _lastNote = "تم إلغاء التنزيل";
                      _say("تم إلغاء التنزيل.", ntf: false);
                      moveBackIfAuto();
                      return;
                    }
                    opt = chosen;
                    moveBackIfAuto();
                  }
                  wantedHeight = opt.height;
                } else {
                  opt = _closest(options, wantedHeight);
                }
                final ok = await _downloadAndSave(info, opt, url);
                if (ok) return;
                if (_cancelled) {
                  _recent.remove(id);
                  return;
                }
                failed.add(info.engine);
              }
              if (!_cancelled) {
                _recent.remove(id);
                _lastNote = "تعذر التحميل";
                _say("فشل التنزيل من جميع المحركات.", ntf: false);
              }
            }

            QualityOption _pickBest(List<QualityOption> o, int maxH) {
              final l = o.where((x) => x.height <= maxH).toList();
              return l.isNotEmpty ? l.first : o.last;
            }

            QualityOption _closest(List<QualityOption> o, int h) {
              final le = o.where((x) => x.height <= h).toList();
              return le.isNotEmpty ? le.first : o.last;
            }

