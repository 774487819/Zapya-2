name: Build Auto Reel Saver APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project & Install Packages
        run: |
          flutter create -a kotlin --org com.autosaver --project-name my_saver_app app_build
          cd app_build
          flutter pub add dio shared_preferences path_provider video_player youtube_explode_dart flutter_local_notifications:^19.4.2

      - name: Enable core library desugaring
        run: |
          cd app_build/android/app
          F=$(ls build.gradle.kts build.gradle 2>/dev/null | head -1)
          if [[ "$F" == *.kts ]]; then
            sed -i 's/compileOptions {/compileOptions {\n        isCoreLibraryDesugaringEnabled = true/' $F
            echo 'dependencies { coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4") }' >> $F
          else
            sed -i 's/compileOptions {/compileOptions {\n        coreLibraryDesugaringEnabled true/' $F
            echo 'dependencies { coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4" }' >> $F
          fi

      - name: Configure Android XML & Manifest
        run: |
          mkdir -p app_build/android/app/src/main/res/xml
          mkdir -p app_build/android/app/src/main/res/values

          cat << 'EOF' > app_build/android/app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">محمّل الريلز الذكي</string>
              <string name="acc_desc">محرك النقر الخلفي لنسخ وتحميل فيديوهات الريلز والتيك توك واليوتيوب تلقائياً بدون علامة مائية</string>
          </resources>
          EOF

          cat << 'EOF' > app_build/android/app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:description="@string/acc_desc"
              android:notificationTimeout="100" />
          EOF

          cat << 'EOF' > app_build/android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.HIGH_SAMPLING_RATE_SENSORS"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>

              <application
                  android:label="@string/app_name"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleInstance"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <!-- FIX: accessibility service must NOT be exported -->
                  <service
                      android:name=".AutoReelGrabberService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

                  <!-- خدمة الإشعار الأمامية لتنزيل الفيديوهات (شريط التقدم + زر الإيقاف) -->
                  <service
                      android:name="com.dexterous.flutterlocalnotifications.ForegroundService"
                      android:exported="false"
                      android:stopWithTask="false"
                      android:foregroundServiceType="dataSync"
                      tools:replace="android:foregroundServiceType"/>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Write Native Kotlin Engine + Progressive Video Validator (MainActivity.kt)
        run: |
          mkdir -p app_build/android/app/src/main/kotlin/com/autosaver/my_saver_app
          cat << 'EOF' > app_build/android/app/src/main/kotlin/com/autosaver/my_saver_app/MainActivity.kt
          package com.autosaver.my_saver_app

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.annotation.SuppressLint
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.content.res.Configuration
          import android.graphics.Path
          import android.graphics.Rect
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.media.MediaCodec
          import android.media.MediaExtractor
          import android.media.MediaFormat
          import android.media.MediaMetadataRetriever
          import android.media.MediaMuxer
          import android.media.MediaScannerConnection
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.provider.MediaStore
          import android.provider.Settings
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.webkit.JavascriptInterface
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.nio.ByteBuffer
          import kotlin.math.abs

          class MainActivity : FlutterActivity() {
              private val CHANNEL = "auto_saver/channel"
              private var methodChannel: MethodChannel? = null
              private var waitingForClipboardFocus = false
              private var headlessWebView: WebView? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  methodChannel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL)

                  methodChannel?.setMethodCallHandler { call, result ->
                      when (call.method) {
                          "openAccessibilitySettings" -> {
                              val intent = Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                              intent.flags = Intent.FLAG_ACTIVITY_NEW_TASK
                              startActivity(intent)
                              result.success(true)
                          }
                          "requestOverlayPermission" -> {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                                  val intent = Intent(
                                      Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                      Uri.parse("package:$packageName")
                                  )
                                  startActivity(intent)
                              }
                              result.success(true)
                          }
                          "checkPermissions" -> {
                              val acc = isServiceEnabled()
                              val overlay = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                  Settings.canDrawOverlays(this)
                              } else true
                              result.success(mapOf("accessibility" to acc, "overlay" to overlay))
                          }
                          "updateSensitivity" -> {
                              val value = call.argument<Double>("value") ?: 11.5
                              getSharedPreferences("auto_saver_prefs", Context.MODE_PRIVATE)
                                  .edit()
                                  .putFloat("sensitivity", value.toFloat())
                                  .apply()
                              result.success(true)
                          }
                          "validateVideoFile" -> {
                              val path = call.argument<String>("path") ?: ""
                              result.success(isPlayableVideoFile(path))
                          }
                          "saveToGallery" -> {
                              val path = call.argument<String>("path") ?: ""
                              val saved = saveVideoToGallery(path)
                              result.success(saved)
                          }
                          "vibrate" -> {
                              val ms = call.argument<Int>("ms") ?: 200
                              vibrateDevice(ms.toLong())
                              result.success(true)
                          }
                          "mergeVideoAudio" -> {
                              val v = call.argument<String>("video") ?: ""
                              val a = call.argument<String>("audio") ?: ""
                              val o = call.argument<String>("out") ?: ""
                              Thread {
                                  val ok = mergeVideoAudio(v, a, o)
                                  Handler(Looper.getMainLooper()).post { result.success(ok) }
                              }.start()
                          }
                          "clearClipboard" -> {
                              try {
                                  val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                                      cm.clearPrimaryClip()
                                  } else {
                                      cm.setPrimaryClip(ClipData.newPlainText("", ""))
                                  }
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.success(false)
                              }
                          }
                          "extractViaWebView" -> {
                              val shortcode = call.argument<String>("shortcode") ?: ""
                              extractInstagramViaWebView(shortcode, result)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              // دمج مسار الفيديو (H.264) مع مسار الصوت (AAC) في ملف MP4 واحد بدون FFmpeg (لدقة 720p/1080p)
              private fun mergeVideoAudio(videoPath: String, audioPath: String, outPath: String): Boolean {
                  var vEx: MediaExtractor? = null
                  var aEx: MediaExtractor? = null
                  var muxer: MediaMuxer? = null
                  var started = false
                  return try {
                      val ve = MediaExtractor()
                      vEx = ve
                      ve.setDataSource(videoPath)
                      val ae = MediaExtractor()
                      aEx = ae
                      ae.setDataSource(audioPath)

                      fun pick(ex: MediaExtractor, prefix: String): Int {
                          for (i in 0 until ex.trackCount) {
                              val mime = ex.getTrackFormat(i).getString(MediaFormat.KEY_MIME) ?: ""
                              if (mime.startsWith(prefix)) return i
                          }
                          return -1
                      }

                      val vi = pick(ve, "video/")
                      val ai = pick(ae, "audio/")
                      if (vi < 0 || ai < 0) return false
                      ve.selectTrack(vi)
                      ae.selectTrack(ai)

                      File(outPath).delete()
                      val m = MediaMuxer(outPath, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)
                      muxer = m
                      val vOut = m.addTrack(ve.getTrackFormat(vi))
                      val aOut = m.addTrack(ae.getTrackFormat(ai))
                      m.start()
                      started = true

                      val buf = ByteBuffer.allocate(8 * 1024 * 1024)
                      val info = MediaCodec.BufferInfo()

                      fun writeOne(ex: MediaExtractor, outTrack: Int): Boolean {
                          buf.clear()
                          val size = ex.readSampleData(buf, 0)
                          if (size < 0) return false
                          val flags = if ((ex.sampleFlags and MediaExtractor.SAMPLE_FLAG_SYNC) != 0)
                              MediaCodec.BUFFER_FLAG_KEY_FRAME else 0
                          info.set(0, size, ex.sampleTime, flags)
                          m.writeSampleData(outTrack, buf, info)
                          ex.advance()
                          return true
                      }

                      var vDone = false
                      var aDone = false
                      while (!vDone || !aDone) {
                          val vt = if (vDone) Long.MAX_VALUE else ve.sampleTime
                          val at = if (aDone) Long.MAX_VALUE else ae.sampleTime
                          if (!vDone && (aDone || vt <= at)) {
                              if (!writeOne(ve, vOut)) vDone = true
                          } else if (!aDone) {
                              if (!writeOne(ae, aOut)) aDone = true
                          }
                      }
                      m.stop()
                      started = false
                      true
                  } catch (e: Exception) {
                      false
                  } finally {
                      try { vEx?.release() } catch (_: Exception) {}
                      try { aEx?.release() } catch (_: Exception) {}
                      try { if (started) muxer?.stop() } catch (_: Exception) {}
                      try { muxer?.release() } catch (_: Exception) {}
                  }
              }

              // التحقق البرمجي الصارم من أن الملف فيديو MP4 حقيقي يحتوي على صورة وصوت وليس جزءاً تالفاً 0.1 MB
              private fun isPlayableVideoFile(filePath: String): Boolean {
                  var retriever: MediaMetadataRetriever? = null
                  return try {
                      val file = File(filePath)
                      if (!file.exists() || file.length() < 150 * 1024) {
                          return false
                      }
                      retriever = MediaMetadataRetriever()
                      retriever.setDataSource(filePath)
                      val hasVideo = retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_HAS_VIDEO)
                      val widthStr = retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_VIDEO_WIDTH)
                      val durationStr = retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_DURATION)

                      val width = widthStr?.toIntOrNull() ?: 0
                      val duration = durationStr?.toLongOrNull() ?: 0L
                      (hasVideo == "yes" && width > 0 && duration > 400L)
                  } catch (e: Exception) {
                      false
                  } finally {
                      // FIX: release() can throw on some devices/APIs - never crash the validator
                      try { retriever?.release() } catch (_: Exception) {}
                  }
              }

              // محرك WebView يستخرج رابط الفيديو الكامل المدمج (Progressive video_url) بدون تقطيع DASH
              @SuppressLint("SetJavaScriptEnabled")
              private fun extractInstagramViaWebView(shortcode: String, result: MethodChannel.Result) {
                  if (shortcode.isEmpty()) {
                      result.success(null)
                      return
                  }
                  val mainHandler = Handler(Looper.getMainLooper())
                  var isCompleted = false

                  fun finishWith(url: String?) {
                      if (!isCompleted) {
                          isCompleted = true
                          mainHandler.post {
                              try {
                                  headlessWebView?.stopLoading()
                                  headlessWebView?.destroy()
                                  headlessWebView = null
                              } catch (_: Exception) {}
                              result.success(url)
                          }
                      }
                  }

                  mainHandler.post {
                      try {
                          headlessWebView?.destroy()
                          val wv = WebView(applicationContext)
                          headlessWebView = wv
                          wv.settings.javaScriptEnabled = true
                          wv.settings.domStorageEnabled = true
                          wv.settings.mediaPlaybackRequiresUserGesture = false
                          wv.settings.mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                          wv.settings.userAgentString =
                              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"

                          wv.addJavascriptInterface(object {
                              @JavascriptInterface
                              fun onVideoUrlFound(url: String?) {
                                  if (!url.isNullOrEmpty() && url.startsWith("http") && !url.contains("bytestart=")) {
                                      finishWith(url)
                                  }
                              }
                          }, "AndroidExtractor")

                          wv.webViewClient = object : WebViewClient() {
                              override fun onPageFinished(view: WebView?, url: String?) {
                                  super.onPageFinished(view, url)
                                  val js = """
                                      (async function() {
                                          try {
                                              function cleanStr(s) {
                                                  return s.replace(/\\\\\//g, '/')
                                                          .replace(/\\\//g, '/')
                                                          .replace(/\\u0026/g, '&')
                                                          .replace(/\\\\u0026/g, '&')
                                                          .replace(/\\"/g, '"')
                                                          .replace(/&amp;/g, '&');
                                              }

                                              var rawHtml = cleanStr(document.documentElement.innerHTML);
                                              var m1 = rawHtml.match(/"video_url"\s*:\s*"(https?:\/\/[^"]+)"/);
                                              if (m1 && m1[1] && m1[1].indexOf('bytestart=') === -1) {
                                                  AndroidExtractor.onVideoUrlFound(m1[1]);
                                                  return;
                                              }

                                              var lsdMatch = document.documentElement.innerHTML.match(/"LSD"\s*,\s*\[\]\s*,\s*\{\s*"token"\s*:\s*"([^"]+)"/);
                                              var lsd = lsdMatch ? lsdMatch[1] : 'AVqbxe3J_YA';
                                              var docIds = ['8845758582119845', '10015901848480474', '7153636648076553'];

                                              for (var i = 0; i < docIds.length; i++) {
                                                  try {
                                                      var body = 'av=0&__d=www&__user=0&__a=1&lsd=' + encodeURIComponent(lsd) +
                                                          '&variables=' + encodeURIComponent(JSON.stringify({shortcode: '$shortcode'})) +
                                                          '&doc_id=' + docIds[i];
                                                      var resp = await fetch('https://www.instagram.com/graphql/query', {
                                                          method: 'POST',
                                                          headers: {
                                                              'Content-Type': 'application/x-www-form-urlencoded',
                                                              'X-IG-App-ID': '936619743392459',
                                                              'X-FB-LSD': lsd,
                                                              'X-ASBD-ID': '129477'
                                                          },
                                                          body: body
                                                      });
                                                      var txt = cleanStr(await resp.text());
                                                      var mGql = txt.match(/"video_url"\s*:\s*"(https?:\/\/[^"]+)"/);
                                                      if (mGql && mGql[1]) {
                                                          AndroidExtractor.onVideoUrlFound(mGql[1]);
                                                          return;
                                                      }
                                                  } catch (e) {}
                                              }

                                              var btn = document.querySelector('.EmbedVideo, .WatchOnInstagram, button, div[role="button"]');
                                              if (btn) btn.click();
                                              for (var t = 0; t < 10; t++) {
                                                  await new Promise(r => setTimeout(r, 400));
                                                  var v = document.querySelector('video');
                                                  if (v && v.src && v.src.indexOf('http') === 0 && v.src.indexOf('bytestart=') === -1) {
                                                      AndroidExtractor.onVideoUrlFound(v.src);
                                                      return;
                                                  }
                                              }
                                          } catch (err) {}
                                      })();
                                  """.trimIndent()
                                  view?.evaluateJavascript(js, null)
                              }
                          }

                          wv.loadUrl("https://www.instagram.com/p/$shortcode/embed/captioned/")

                          mainHandler.postDelayed({
                              finishWith(null)
                          }, 10000)
                      } catch (e: Exception) {
                          finishWith(null)
                      }
                  }
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  if (intent.getBooleanExtra("auto_copied", false)) {
                      waitingForClipboardFocus = true
                  }
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus && (waitingForClipboardFocus || intent?.getBooleanExtra("auto_copied", false) == true)) {
                      waitingForClipboardFocus = false
                      intent?.removeExtra("auto_copied")

                      Handler(Looper.getMainLooper()).postDelayed({
                          val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          val clipText = clipboard.primaryClip?.getItemAt(0)?.text?.toString() ?: ""

                          // فيديوهات اليوتيوب الطويلة: نبقى داخل التطبيق لتظهر نافذة اختيار الدقة والتأكيد
                          val isLongYt = clipText.contains("youtu.be/") || clipText.contains("youtube.com/watch")
                          // (الرجوع للخلفية يتم بعد استلام الرابط حتى يبدأ إشعار التنزيل والتطبيق ظاهر)

                          if (clipText.isNotEmpty()) {
                              methodChannel?.invokeMethod("onAutoLinkCaptured", clipText)
                          }
                          if (!isLongYt) {
                              Handler(Looper.getMainLooper()).postDelayed({ moveTaskToBack(true) }, 700)
                          }
                      }, 150)
                  }
              }

              private fun saveVideoToGallery(filePath: String): Boolean {
                  return try {
                      val srcFile = File(filePath)
                      if (!srcFile.exists()) return false
                      val fileName = "Reel_${System.currentTimeMillis()}.mp4"

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          val values = ContentValues().apply {
                              put(MediaStore.Video.Media.DISPLAY_NAME, fileName)
                              put(MediaStore.Video.Media.MIME_TYPE, "video/mp4")
                              put(MediaStore.Video.Media.RELATIVE_PATH, Environment.DIRECTORY_MOVIES + "/AutoReelSaver")
                              put(MediaStore.Video.Media.IS_PENDING, 1)
                          }
                          val resolver = applicationContext.contentResolver
                          val uri = resolver.insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, values) ?: return false
                          resolver.openOutputStream(uri)?.use { outStream ->
                              FileInputStream(srcFile).use { inStream ->
                                  inStream.copyTo(outStream)
                              }
                          }
                          values.clear()
                          values.put(MediaStore.Video.Media.IS_PENDING, 0)
                          resolver.update(uri, values, null, null)
                          true
                      } else {
                          val moviesDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_MOVIES)
                          val appDir = File(moviesDir, "AutoReelSaver")
                          if (!appDir.exists()) appDir.mkdirs()
                          val destFile = File(appDir, fileName)
                          FileInputStream(srcFile).use { inStream ->
                              FileOutputStream(destFile).use { outStream ->
                                  inStream.copyTo(outStream)
                              }
                          }
                          MediaScannerConnection.scanFile(this, arrayOf(destFile.absolutePath), arrayOf("video/mp4"), null)
                          true
                      }
                  } catch (e: Exception) {
                      false
                  }
              }

              private fun vibrateDevice(durationMs: Long) {
                  val vibrator = getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      vibrator.vibrate(VibrationEffect.createOneShot(durationMs, VibrationEffect.DEFAULT_AMPLITUDE))
                  } else {
                      @Suppress("DEPRECATION")
                      vibrator.vibrate(durationMs)
                  }
              }

              private fun isServiceEnabled(): Boolean {
                  val expected = "$packageName/${AutoReelGrabberService::class.java.canonicalName}"
                  val enabledServices = Settings.Secure.getString(
                      contentResolver,
                      Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: return false
                  return enabledServices.contains(expected)
              }
          }

          class AutoReelGrabberService : AccessibilityService(), SensorEventListener {
              // الخدمة تعمل فقط أثناء وجودك داخل هذه التطبيقات
              private val targetPackages = setOf(
                  "com.instagram.android",
                  "com.instagram.lite",
                  "com.zhiliaoapp.musically",
                  "com.zhiliaoapp.musically.go",
                  "com.ss.android.ugc.trill",
                  "com.google.android.youtube"
              )

              private var sensorManager: SensorManager? = null
              private var listening = false
              private var busy = false
              private var firstTapTime: Long = 0
              private var lastActionTime: Long = 0
              private val handler = Handler(Looper.getMainLooper())

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  sensorManager = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  if (isTargetForeground()) startListening()
              }

              private fun isTargetForeground(): Boolean {
                  val pkg = rootInActiveWindow?.packageName?.toString() ?: return false
                  return pkg in targetPackages
              }

              private fun startListening() {
                  if (listening) return
                  val sensor = sensorManager?.getDefaultSensor(Sensor.TYPE_LINEAR_ACCELERATION) ?: return
                  sensorManager?.registerListener(this, sensor, SensorManager.SENSOR_DELAY_GAME)
                  listening = true
              }

              private fun stopListening() {
                  if (!listening) return
                  sensorManager?.unregisterListener(this)
                  listening = false
                  firstTapTime = 0
              }

              // تشغيل المستشعر عند دخول انستغرام/تيك توك/يوتيوب وإيقافه عند الخروج منهم (يوفر البطارية)
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null || event.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
                  val pkg = event.packageName?.toString() ?: return
                  when {
                      pkg in targetPackages -> startListening()
                      pkg == packageName || pkg == "android" ||
                          pkg.contains("systemui") || pkg.contains("inputmethod") || pkg.contains("keyboard") -> Unit
                      else -> stopListening()
                  }
              }

              override fun onSensorChanged(event: SensorEvent?) {
                  if (event == null || busy) return
                  val prefs = getSharedPreferences("auto_saver_prefs", Context.MODE_PRIVATE)
                  val sensitivity = prefs.getFloat("sensitivity", 11.5f)

                  val x = abs(event.values[0])
                  val y = abs(event.values[1])
                  val z = abs(event.values[2])

                  if (z > sensitivity && x < 6.0f && y < 6.0f) {
                      val now = System.currentTimeMillis()
                      if (now - lastActionTime < 5000) return

                      if (now - firstTapTime > 500) {
                          firstTapTime = now
                      } else {
                          val diff = now - firstTapTime
                          if (diff in 120..500) {
                              firstTapTime = 0
                              // حماية إضافية: لا ننفّذ شيئاً إلا إذا كانت الواجهة الحالية من التطبيقات المستهدفة
                              if (!isTargetForeground()) return
                              lastActionTime = now
                              executeAutoShareAndCopy()
                          }
                      }
                  }
              }

              private fun executeAutoShareAndCopy() {
                  val root = rootInActiveWindow ?: return
                  busy = true
                  vibrateShort(120)

                  val pkg = root.packageName?.toString() ?: ""
                  if (pkg == "com.google.android.youtube" && isLandscape()) {
                      // يوتيوب بوضع ملء الشاشة لا يعرض زر المشاركة: نخرج منه أولاً ثم نكمل
                      performGlobalAction(GLOBAL_ACTION_BACK)
                      handler.postDelayed({ shareThenCopy(0, 5) }, 1200)
                  } else {
                      shareThenCopy(0, 1)
                  }
              }

              private fun isLandscape(): Boolean =
                  resources.configuration.orientation == Configuration.ORIENTATION_LANDSCAPE

              // نضغط زر المشاركة (مع إعادة المحاولة بعد الخروج من ملء الشاشة) ثم ننتقل لنسخ الرابط
              private fun shareThenCopy(attempt: Int, maxAttempts: Int) {
                  val shareWords = listOf("مشاركة", "إرسال", "Share", "Send", "share")
                  val r = rootInActiveWindow
                  val clicked = r != null && findAndClickNode(r, shareWords)
                  when {
                      clicked -> waitAndClickCopy(0)
                      attempt + 1 < maxAttempts ->
                          handler.postDelayed({ shareThenCopy(attempt + 1, maxAttempts) }, 600)
                      !isLandscape() -> {
                          tapCoordinates(0.91f, 0.72f)
                          waitAndClickCopy(0)
                      }
                      else -> {
                          vibrateFail()
                          busy = false
                      }
                  }
              }

              // قائمة المشاركة قد تتأخر: نحاول عدة مرات، ولا نفتح التطبيق إلا إذا نجح نسخ الرابط فعلاً
              // (هذا يمنع تحميل نفس الفيديو مرتين بسبب رابط قديم عالق في الحافظة)
              private fun waitAndClickCopy(attempt: Int) {
                  val delayMs = if (attempt == 0) 900L else 400L
                  handler.postDelayed({
                      val currentRoot = rootInActiveWindow
                      val copyWords = listOf("نسخ الرابط", "نسخ", "Copy link", "Copy URL", "copy")
                      val clicked = currentRoot != null && findAndClickNode(currentRoot, copyWords)

                      when {
                          clicked -> handler.postDelayed({
                              val launchIntent = Intent(this, MainActivity::class.java).apply {
                                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                                  putExtra("auto_copied", true)
                              }
                              startActivity(launchIntent)
                              busy = false
                          }, 450)
                          attempt < 5 -> waitAndClickCopy(attempt + 1)
                          else -> {
                              vibrateFail()
                              busy = false
                          }
                      }
                  }, delayMs)
              }

              // العنصر يجب أن يكون ظاهراً فعلاً على الشاشة الآن.
              // (تيك توك وانستغرام يبنيان الفيديو السابق والتالي في الخلفية، وأزرارهما موجودة في الشجرة
              //  لكنها خارج الشاشة، فكان يُضغط زر مشاركة فيديو آخر وليس الذي تشاهده)
              private fun isOnScreen(node: AccessibilityNodeInfo): Boolean {
                  if (!node.isVisibleToUser) return false
                  val r = Rect()
                  node.getBoundsInScreen(r)
                  if (r.width() <= 0 || r.height() <= 0) return false
                  val m = resources.displayMetrics
                  return r.centerX() in 0..m.widthPixels && r.centerY() in 0..m.heightPixels
              }

              private fun findAndClickNode(node: AccessibilityNodeInfo, keywords: List<String>): Boolean {
                  if (isOnScreen(node)) {
                      val text = node.text?.toString() ?: ""
                      val desc = node.contentDescription?.toString() ?: ""
                      val viewId = node.viewIdResourceName ?: ""

                      for (word in keywords) {
                          if (text.contains(word, ignoreCase = true) ||
                              desc.contains(word, ignoreCase = true) ||
                              viewId.contains(word, ignoreCase = true)
                          ) {
                              if (clickClickableParent(node)) return true
                          }
                      }
                  }

                  for (i in 0 until node.childCount) {
                      val child = node.getChild(i) ?: continue
                      if (findAndClickNode(child, keywords)) return true
                  }
                  return false
              }

              private fun clickClickableParent(node: AccessibilityNodeInfo?): Boolean {
                  var current = node
                  while (current != null) {
                      if (current.isClickable) {
                          return current.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                      }
                      current = current.parent
                  }
                  return false
              }

              private fun tapCoordinates(xRatio: Float, yRatio: Float) {
                  // FIX: dispatchGesture requires API 24+ (Android 7.0) - guard against crash on old devices
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.N) return
                  val metrics = resources.displayMetrics
                  val path = Path().apply {
                      moveTo(metrics.widthPixels * xRatio, metrics.heightPixels * yRatio)
                  }
                  val gesture = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, 80))
                      .build()
                  dispatchGesture(gesture, null, null)
              }

              private fun vibrateShort(ms: Long) {
                  val vibrator = getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      vibrator.vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE))
                  } else {
                      @Suppress("DEPRECATION")
                      vibrator.vibrate(ms)
                  }
              }

              // اهتزازتان قصيرتان = فشل (لم يُعثر على زر المشاركة أو نسخ الرابط)
              private fun vibrateFail() {
                  val vibrator = getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  val pattern = longArrayOf(0, 80, 90, 80)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      vibrator.vibrate(VibrationEffect.createWaveform(pattern, -1))
                  } else {
                      @Suppress("DEPRECATION")
                      vibrator.vibrate(pattern, -1)
                  }
              }

              override fun onUnbind(intent: Intent?): Boolean {
                  stopListening()
                  return super.onUnbind(intent)
              }

              override fun onDestroy() {
                  stopListening()
                  super.onDestroy()
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}
              override fun onInterrupt() {}
          }
          EOF

