            // المحرك 1: مكتبة youtube_explode
            Future<_YtInfo?> _ytViaLibrary(String id) async {
              final m = await _yt.videos.streamsClient
                  .getManifest(id)
                  .timeout(const Duration(seconds: 25));
              final res = <_YtOption>[];

              final audios = m.audioOnly
                  .where((a) =>
                      a.container.name == 'mp4' && a.audioCodec.startsWith('mp4a'))
                  .toList()
                ..sort((a, b) => b.bitrate.bitsPerSecond.compareTo(a.bitrate.bitsPerSecond));

              int secs = 0;
              if (audios.isNotEmpty) {
                final a = audios.first;
                if (a.bitrate.bitsPerSecond > 0) {
                  secs = (a.size.totalBytes * 8 / a.bitrate.bitsPerSecond).round();
                }
                final vids = m.videoOnly
                    .where((v) =>
                        v.container.name == 'mp4' && v.videoCodec.startsWith('avc1'))
                    .toList()
                  ..sort((x, y) {
                    final c = y.videoResolution.height.compareTo(x.videoResolution.height);
                    return c != 0 ? c : y.size.totalBytes.compareTo(x.size.totalBytes);
                  });
                final seen = <String>{};
                for (final v in vids) {
                  if (seen.add(v.videoQualityLabel)) {
                    res.add(_YtOption(
                      v.videoQualityLabel,
                      height: v.videoResolution.height,
                      videoUrl: v.url,
                      videoBytes: v.size.totalBytes,
                      videoInfo: v,
                      audioUrl: a.url,
                      audioBytes: a.size.totalBytes,
                      audioInfo: a,
                    ));
                  }
                }
              }

              // احتياط: صيغ مدمجة (غالباً 360p)
              if (res.isEmpty) {
                final mux = m.muxed.toList()
                  ..sort((a, b) =>
                      b.videoResolution.height.compareTo(a.videoResolution.height));
                final seen = <String>{};
                for (final s in mux) {
                  if (seen.add(s.videoQualityLabel)) {
                    res.add(_YtOption(
                      s.videoQualityLabel,
                      height: s.videoResolution.height,
                      videoUrl: s.url,
                      videoBytes: s.size.totalBytes,
                      videoInfo: s,
                    ));
                  }
                }
              }
              return _YtInfo(null, secs, res, 'youtube_explode');
            }

            // المحركان 2 و3: طلب مباشر لواجهة يوتيوب الداخلية (عميل ANDROID_VR وعميل IOS)
            Future<_YtInfo?> _ytViaInnerTube(String id, int which) async {
              final vr = which == 0;
              final ua = vr
                  ? 'com.google.android.apps.youtube.vr.oculus/1.62.27 (Linux; U; Android 12L; eureka-user Build/SQ3A.220605.009.A1) gzip'
                  : 'com.google.ios.youtube/20.10.4 (iPhone16,2; U; CPU iOS 18_3_2 like Mac OS X;)';
              final client = <String, dynamic>{
                'clientName': vr ? 'ANDROID_VR' : 'IOS',
                'clientVersion': vr ? '1.62.27' : '20.10.4',
                'deviceMake': vr ? 'Oculus' : 'Apple',
                'deviceModel': vr ? 'Quest 3' : 'iPhone16,2',
                'osName': vr ? 'Android' : 'iPhone',
                'osVersion': vr ? '12L' : '18.3.2.22D82',
                'userAgent': ua,
                'hl': 'en',
                'timeZone': 'UTC',
                'utcOffsetMinutes': 0,
              };
              if (vr) client['androidSdkVersion'] = 32;

              final res = await _dio.post(
                'https://www.youtube.com/youtubei/v1/player?prettyPrint=false',
                data: jsonEncode({
                  'context': {'client': client},
                  'videoId': id,
                  'contentCheckOk': true,
                  'racyCheckOk': true,
                }),
                options: Options(
                  contentType: 'application/json',
                  headers: {
                    'User-Agent': ua,
                    'X-YouTube-Client-Name': vr ? '28' : '5',
                    'X-YouTube-Client-Version': vr ? '1.62.27' : '20.10.4',
                    'Origin': 'https://www.youtube.com',
                  },
                  receiveTimeout: const Duration(seconds: 12),
                ),
              );
              final data = res.data is String ? jsonDecode(res.data) : res.data;
              if (data is! Map) return null;
              final ps = data['playabilityStatus'];
              if (ps is Map && ps['status'] != 'OK') return null;
              final sd = data['streamingData'];
              if (sd is! Map) return null;

              Map? bestAudio;
              int bestBr = -1;
              final vids = <Map>[];
              for (final e in ((sd['adaptiveFormats'] as List?) ?? const [])) {
                if (e is! Map || e['url'] == null) continue;
                final mt = '${e['mimeType']}';
                final len = int.tryParse('${e['contentLength']}') ?? 0;
                if (len <= 0) continue;
                if (mt.startsWith('audio/mp4')) {
                  final br = ((e['bitrate'] ?? 0) as num).toInt();
                  if (br > bestBr) {
                    bestBr = br;
                    bestAudio = e;
                  }
                } else if (mt.startsWith('video/mp4') && mt.contains('avc1')) {
                  vids.add(e);
                }
              }
              final audio = bestAudio;
              if (audio == null || vids.isEmpty) return null;

              vids.sort((a, b) => ((b['height'] ?? 0) as num)
                  .toInt()
                  .compareTo(((a['height'] ?? 0) as num).toInt()));

              final headers = <String, String>{'User-Agent': ua};
              final opts = <_YtOption>[];
              final seen = <String>{};
              for (final v in vids) {
                final h = ((v['height'] ?? 0) as num).toInt();
                final label = '${v['qualityLabel'] ?? '${h}p'}';
                if (!seen.add(label)) continue;
                opts.add(_YtOption(
                  label,
                  height: h,
                  videoUrl: Uri.parse('${v['url']}'),
                  videoBytes: int.parse('${v['contentLength']}'),
                  audioUrl: Uri.parse('${audio['url']}'),
                  audioBytes: int.parse('${audio['contentLength']}'),
                  headers: headers,
                ));
              }

              String? title;
              int secs = 0;
              final vd = data['videoDetails'];
              if (vd is Map) {
                title = vd['title']?.toString();
                secs = int.tryParse('${vd['lengthSeconds']}') ?? 0;
              }
              return _YtInfo(title, secs, opts, vr ? 'ANDROID_VR' : 'IOS');
            }

            // المحرك 4: خوادم Piped (تعطي روابط جاهزة لجوجل فيديو) - قد تتوقف بعض النسخ فنجرّب أكثر من واحدة
            Future<_YtInfo?> _ytViaPiped(String id) async {
              const bases = [
                'https://pipedapi.kavin.rocks',
                'https://pipedapi.adminforge.de',
                'https://api.piped.private.coffee',
              ];
              for (final base in bases) {
                try {
                  final r = await _dio
                      .get('$base/streams/$id',
                          options: Options(receiveTimeout: const Duration(seconds: 8)))
                      .timeout(const Duration(seconds: 10));
                  final d = r.data is String ? jsonDecode(r.data) : r.data;
                  if (d is! Map) continue;

                  Map? bestAudio;
                  int bestBr = -1;
                  for (final e in ((d['audioStreams'] as List?) ?? const [])) {
                    if (e is! Map || e['url'] == null) continue;
                    if (!'${e['mimeType']}'.startsWith('audio/mp4')) continue;
                    if ((int.tryParse('${e['contentLength']}') ?? 0) <= 0) continue;
                    final br = ((e['bitrate'] ?? 0) as num).toInt();
                    if (br > bestBr) {
                      bestBr = br;
                      bestAudio = e;
                    }
                  }
                  final audio = bestAudio;
                  if (audio == null) continue;

                  final vids = <Map>[];
                  for (final e in ((d['videoStreams'] as List?) ?? const [])) {
                    if (e is! Map || e['url'] == null) continue;
                    if (e['videoOnly'] != true) continue;
                    if (!'${e['mimeType']}'.startsWith('video/mp4')) continue;
                    if (!'${e['codec']}'.startsWith('avc1')) continue;
                    if ((int.tryParse('${e['contentLength']}') ?? 0) <= 0) continue;
                    vids.add(e);
                  }
                  if (vids.isEmpty) continue;
                  vids.sort((a, b) => ((b['height'] ?? 0) as num)
                      .toInt()
                      .compareTo(((a['height'] ?? 0) as num).toInt()));

                  final opts = <_YtOption>[];
                  final seen = <String>{};
                  for (final v in vids) {
                    final h = ((v['height'] ?? 0) as num).toInt();
                    final label = '${v['quality'] ?? '${h}p'}';
                    if (!seen.add(label)) continue;
                    opts.add(_YtOption(
                      label,
                      height: h,
                      videoUrl: Uri.parse('${v['url']}'),
                      videoBytes: int.parse('${v['contentLength']}'),
                      audioUrl: Uri.parse('${audio['url']}'),
                      audioBytes: int.parse('${audio['contentLength']}'),
                    ));
                  }
                  return _YtInfo(d['title']?.toString(),
                      int.tryParse('${d['duration']}') ?? 0, opts, 'Piped');
                } catch (_) {}
              }
              return null;
            }

            // نص قصير لسبب الفشل (يظهر للمستخدم لتشخيص المشكلة)
            String _short(Object e) {
              String t;
              if (e is DioException) {
                t = '${e.type.name} ${e.response?.statusCode ?? ''}';
              } else {
                t = e.toString().replaceAll('Exception: ', '').split('\n').first;
              }
              return t.length > 80 ? t.substring(0, 80) : t;
            }

            // يختار من نتيجة محرك ما نفس الدقة التي اختارها المستخدم (أو أقرب دقة أقل منها)
            _YtOption? _matchOption(_YtInfo inf, _YtOption want) {
              for (final o in inf.options) {
                if (o.label == want.label) return o;
              }
              _YtOption? best;
              for (final o in inf.options) {
                if (o.height <= want.height && (best == null || o.height > best.height)) {
                  best = o;
                }
              }
              return best ?? (inf.options.isNotEmpty ? inf.options.last : null);
            }

            // تشغيل كل المحركات معاً: أول نتيجة تنتظر 1.5 ثانية للباقي ثم نختار الأعلى دقة، وبقية المحركات تبقى احتياطاً
            _YtResolver _resolveYoutube(String id) {
              final r = _YtResolver();
              int pending = 4;
              Timer? grace;

              void finishFirst() {
                if (r.first.isCompleted) return;
                grace?.cancel();
                if (r.infos.isEmpty) {
                  r.first.complete(null);
                  return;
                }
                final best = [...r.infos]
                  ..sort((a, b) => b.bestHeight.compareTo(a.bestHeight));
                r.first.complete(best.first);
              }

              void done(_YtInfo? x) {
                if (x != null && x.options.isNotEmpty) {
                  r.infos.add(x);
                  grace ??= Timer(const Duration(milliseconds: 1500), finishFirst);
                }
                pending--;
                if (pending == 0) {
                  finishFirst();
                  if (!r.all.isCompleted) r.all.complete();
                }
              }

              void run(String name, Future<_YtInfo?> f) {
                f.then((x) {
                  if (x == null || x.options.isEmpty) _ytLog.add('$name: لا توجد صيغ');
                  done(x);
                }).catchError((e) {
                  _ytLog.add('$name: ${_short(e)}');
                  done(null);
                });
              }

              run('youtube_explode', _ytViaLibrary(id));
              run('ANDROID_VR', _ytViaInnerTube(id, 0));
              run('IOS', _ytViaInnerTube(id, 1));
              run('Piped', _ytViaPiped(id));

              Future.delayed(const Duration(seconds: 25), () {
                finishFirst();
                if (!r.all.isCompleted) r.all.complete();
              });
              return r;
            }

